<!doctype html><html lang="zh-CN"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"><title>火力突围·手机试玩</title><style>*{box-sizing:border-box}body{margin:0;background:#101827;color:#fff;font:16px system-ui;overflow:hidden}canvas{display:block;margin:auto;touch-action:none}#hud{position:fixed;top:12px;left:14px;right:14px;display:flex;justify-content:space-between;font-weight:800;text-shadow:0 2px 4px #000}#panel{position:fixed;inset:0;background:#091322dc;display:grid;place-content:center;text-align:center;padding:22px}button{background:#fbbf24;border:0;border-radius:15px;padding:14px 25px;font-size:20px;font-weight:bold}small{opacity:.8}</style></head><body><canvas id="game"></canvas><div id="hud"><span id="power">🔥 10</span><span id="life">❤️ 5</span><span id="timer">0s</span></div><div id="panel"><h1>🔥 火力突围</h1><p>数字门 × 敌潮 × 重甲怪 × Boss</p><p><small>左右滑动 / 鼠标拖动 / 方向键</small></p><button id="start">开始试玩</button></div><script>
(()=>{'use strict';let c=document.querySelector('#game'),g=c.getContext('2d'),panel=document.querySelector('#panel'),start=document.querySelector('#start'),pEl=document.querySelector('#power'),lEl=document.querySelector('#life'),tEl=document.querySelector('#timer');let W=400,H=700,x=200,fire=10,hp=5,t=0,shot=0,spawn=0,gateT=0,score=0,state='menu',last=0,bullets=[],mobs=[],fx=[],gates=[],boss=null,keys={};function resize(){W=Math.min(innerWidth,580);H=innerHeight;let d=Math.min(devicePixelRatio||1,2);c.width=W*d;c.height=H*d;c.style.width=W+'px';c.style.height=H+'px';g.setTransform(d,0,0,d,0,0)}addEventListener('resize',resize);resize();function rnd(a,b){return a+Math.random()*(b-a)}function burst(px,py,col,n=8){for(let i=0;i<n;i++)fx.push({x:px,y:py,vx:rnd(-150,150),vy:rnd(-170,140),life:rnd(.15,.45),col})}function mob(kind,px){let max=kind===2?160+t*3:kind===1?45+t:12+t*.3;mobs.push({x:px,y:-30,r:kind===2?29:kind===1?19:12,kind,hp:max,max,vy:kind===2?64:kind===1?100:145})}function makeGate(){let pool=[['+50',50],['×2',2],['+100',100],['−40',-40],['÷2',.5]];gates.push({y:-60,a:pool[Math.floor(rnd(0,3))],b:pool[Math.floor(rnd(0,5))],used:false})}function apply(op){fire=op[0].startsWith('×')?fire*2:op[0].startsWith('÷')?Math.round(fire/2):fire+op[1];fire=Math.max(1,Math.min(300,fire));burst(x,H-120,'#fef08a',30)}function reset(){x=W/2;fire=10;hp=5;t=shot=spawn=gateT=score=0;bullets=[];mobs=[];fx=[];gates=[];boss=null;state='play';panel.style.display='none';last=performance.now();requestAnimationFrame(loop)}start.onclick=reset;function finish(win){state='end';panel.style.display='grid';panel.innerHTML='<h1>'+(win?'🏆 突围成功':'💥 突围失败')+'</h1><p>消灭 '+score+' 个敌人 · 最终火力 '+fire+'</p><button id="again">再玩一次</button>';document.querySelector('#again').onclick=reset}function update(dt){t+=dt;if(keys.ArrowLeft||keys.a)x-=330*dt;if(keys.ArrowRight||keys.d)x+=330*dt;x=Math.max(25,Math.min(W-25,x));shot+=dt;let rate=Math.max(.07,.25-fire*.0006);while(shot>=rate){shot-=rate;let n=fire>=130?5:fire>=55?3:fire>=25?2:1;for(let j=0;j<n;j++)bullets.push({x:x+(j-(n-1)/2)*12,y:H-140,vx:(j-(n-1)/2)*42,vy:-670,dmg:Math.max(5,fire*.45/n)})}spawn+=dt;let period=Math.max(.17,.56-t*.005);while(spawn>=period&&t<65){spawn-=period;let z=Math.random();mob(z<.08?2:z<.28?1:0,rnd(35,W-35));if(t>14&&Math.random()<.5)mob(0,rnd(35,W-35))}gateT+=dt;if(gateT>=8&&t<56){gateT=0;makeGate()}if(t>=65&&!boss)boss={x:W/2,y:-80,r:54,hp:2600,max:2600};if(boss){boss.y=Math.min(125,boss.y+65*dt);boss.x=W/2+Math.sin(t*1.4)*W*.2;if(boss.hp<=0){finish(true);return}}for(let i=bullets.length-1;i>=0;i--){let b=bullets[i];b.x+=b.vx*dt;b.y+=b.vy*dt;if(b.y<0){bullets.splice(i,1);continue}let target=boss&&Math.hypot(b.x-boss.x,b.y-boss.y)<boss.r?boss:null;if(!target)target=mobs.find(e=>Math.hypot(b.x-e.x,b.y-e.y)<e.r+5);if(target){target.hp-=b.dmg;bullets.splice(i,1);burst(b.x,b.y,'#fef08a',2);if(target!==boss&&target.hp<=0){score++;burst(target.x,target.y,target.kind===2?'#fb7185':'#a3e635',target.kind===2?25:9);mobs.splice(mobs.indexOf(target),1)}}}for(let i=mobs.length-1;i>=0;i--){let e=mobs[i];e.y+=e.vy*dt;if(e.y>H-126&&Math.abs(e.x-x)<e.r+19){hp-=e.kind===2?2:1;burst(x,H-120,'#fb7185',18);mobs.splice(i,1)}else if(e.y>H+35)mobs.splice(i,1)}for(let i=gates.length-1;i>=0;i--){let a=gates[i];a.y+=135*dt;if(a.y>H-150&&!a.used){a.used=true;apply(x<W/2?a.a:a.b)}if(a.y>H)gates.splice(i,1)}for(let i=fx.length-1;i>=0;i--){let f=fx[i];f.x+=f.vx*dt;f.y+=f.vy*dt;f.life-=dt;if(f.life<=0)fx.splice(i,1)}if(hp<=0){finish(false);return}pEl.textContent='🔥 '+fire;lEl.textContent='❤️ '+hp;tEl.textContent=Math.floor(t)+'s'}function draw(){g.fillStyle='#122333';g.fillRect(0,0,W,H);g.fillStyle='#1d3c4c';g.fillRect(8,0,W-16,H);g.strokeStyle='#36596b';g.setLineDash([22,20]);for(let j=1;j<5;j++){g.beginPath();g.moveTo(W*j/5,0);g.lineTo(W*j/5,H);g.stroke()}g.setLineDash([]);for(const a of gates){for(let j=0;j<2;j++){let op=j?a.b:a.a,xx=j?W/2:8;g.fillStyle=op[0].startsWith('−')||op[0].startsWith('÷')?'#be123c':'#047857';g.fillRect(xx,a.y,W/2-8,52);g.fillStyle='white';g.font='bold 27px system-ui';g.textAlign='center';g.fillText(op[0],xx+W/4-4,a.y+36)}}for(const b of bullets){g.fillStyle='#fde68a';g.fillRect(b.x-3,b.y-14,6,19)}for(const e of mobs){g.fillStyle=e.kind===2?'#be123c':e.kind===1?'#fb923c':'#a3e635';g.beginPath();g.arc(e.x,e.y,e.r,0,7);g.fill();g.fillStyle='#111827';g.fillRect(e.x-e.r,e.y-e.r-10,e.r*2,5);g.fillStyle='#f43f5e';g.fillRect(e.x-e.r,e.y-e.r-10,e.r*2*Math.max(0,e.hp/e.max),5)}if(boss){g.fillStyle='#7c3aed';g.beginPath();g.arc(boss.x,boss.y,boss.r,0,7);g.fill();g.fillStyle='#fff';g.font='bold 20px system-ui';g.textAlign='center';g.fillText('BOSS',boss.x,boss.y+7);g.fillStyle='#475569';g.fillRect(20,55,W-40,12);g.fillStyle='#fb7185';g.fillRect(20,55,(W-40)*Math.max(0,boss.hp/boss.max),12)}for(const f of fx){g.globalAlpha=Math.min(1,f.life*3);g.fillStyle=f.col;g.fillRect(f.x,f.y,4,4)}g.globalAlpha=1;g.save();g.translate(x,H-122);g.fillStyle='#fbbf24';g.beginPath();g.ellipse(0,7,20,24,0,0,7);g.fill();g.beginPath();g.moveTo(-17,-10);g.lineTo(-16,-34);g.lineTo(-2,-18);g.fill();g.beginPath();g.moveTo(18,-10);g.lineTo(14,-34);g.lineTo(2,-18);g.fill();g.fillStyle='#171717';g.fillRect(-10,-4,5,5);g.fillRect(5,-4,5,5);g.fillStyle='#ef4444';g.fillRect(-21,14,42,5);g.restore();g.fillStyle='#111827';g.beginPath();g.arc(x-26,H-115,10,0,7);g.fill();g.fillStyle='#fde047';g.fillRect(x-30,H-118,4,3);g.fillRect(x-23,H-118,4,3)}function loop(now){if(state!=='play')return;let dt=Math.min(.04,(now-last)/1000||.016);last=now;update(dt);draw();if(state==='play')requestAnimationFrame(loop)}function move(e){let r=c.getBoundingClientRect();x=Math.max(25,Math.min(W-25,e.clientX-r.left))}c.addEventListener('pointerdown',e=>{c.setPointerCapture(e.pointerId);move(e)});c.addEventListener('pointermove',e=>{if(e.buttons||e.pointerType==='touch')move(e)});addEventListener('keydown',e=>keys[e.key]=true);addEventListener('keyup',e=>keys[e.key]=false)})();
</script></body></html>
