:11px;color:#a3c6b0}.stats strong{font-size:24px;display:block;color:#f5d79d}#controls{position:absolute;bottom:max(2%,env(safe-area-inset-bottom));right:3%;width:35%;pointer-events:none}#controls span{display:none}#skill{pointer-events:auto;width:100%;min-height:58px;background:#f2c67f;color:#273d38;border:2px solid #ffe7b0;border-radius:12px;box-shadow:0 4px 0 #8a704c;padding:7px 4px}#skill b{font-size:14px;display:block}#skill small{font-size:9px;display:block;margin-top:3px}#skill:disabled{background:#354d49;color:#9bb2a4;border-color:#5b7466;box-shadow:0 3px 0 #233b37}button:focus-visible{outline:3px solid white}@container(max-height:650px){#overlay{padding:6%;gap:8px}.eyebrow{font-size:8px;letter-spacing:2px}.title{font-size:32px}.subtitle{font-size:12px}.rule{font-size:10px;padding:8px;line-height:1.7}.primary{font-size:15px;padding:12px}.fine{font-size:9px}.secondary{padding:9px}.stats strong{font-size:20px}}

</style></head><body><main id="game"><canvas id="c" aria-label="裂潮战场：滑动寻找橙色缝眼，击碎后牵手向前冲锋"></canvas><div id="top"><button id="pause" aria-label="暂停">Ⅱ</button><button id="sound">音效 OFF</button></div><section id="overlay" aria-live="polite"></section><div id="controls" hidden><button id="skill"><b>咕咕 · 拉弦冲锋</b><small>先凿穿缺口，再向前冲</small></button></div></main><script type="module">// A moving crowd is the level. Cutting a traversable seam enables a forward leap.
const W=420,H=760,GOAL=3600,MAX_ENEMIES=760,LIMIT=180;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function rng(seed){return()=>{let t=seed+=0x6d2b79f5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
const tier=p=>p>=70?2:p>=40?1:0;
const weapons=['双生四弦','六弦破潮','八弦日冕'];
function note(s,text,color='#ffe3a4'){s.notices.push({text,color,life:2.4});if(s.notices.length>2)s.notices.shift();}
function createGame(seed=Date.now()){
 const s={seed,random:rng(seed),mode:'play',time:0,distance:0,camera:0,x:210,target:210,hull:100,power:26,width:1,tension:36,rear:0,kills:0,cleanRushes:0,hardRushes:0,cooldown:0,fire:0,spawn:.65,phase:0,dash:null,pulse:0,invulnerable:0,streak:0,serial:0,enemies:[],traces:[],particles:[],notices:[],choice:null,nextChoice:320,history:[],fronts:[],peak:0,weaponTier:0,reason:'',footprints:[],footTimer:0,grid:new Uint16Array(30*52)};
 let previous=210;for(let i=0;i<6;i++){let x=70+s.random()*280;if(Math.abs(x-previous)<95)x=previous<210?315:105;s.fronts.push({z:430+i*520,x,baseX:x,hp:140+i*22,max:140+i*22,open:0,breached:false,phase:s.random()*6.28});previous=x;}
 for(let row=0;row<25;row++)spawnRow(s,160+row*22,0);
 note(s,'先打穿正前方缺口，再按右下角牵手冲锋');return s;
}
function spawnEnemy(s,x,z,type='swarm'){
 if(s.enemies.length>=MAX_ENEMIES)return;
 const hp=type==='heavy'?32+s.phase*3:10+s.phase;
 s.enemies.push({id:++s.serial,x:clamp(x,18,402),z,hp,max:hp,type,stun:0,phase:s.random()*6.28,dead:false});
}
function spawnRow(s,z,phase=s.phase){
 const shift=Math.sin(z*.008)*9;
 for(let col=0;col<25;col++){const x=17+col*16+shift+(s.random()-.5)*5;spawnEnemy(s,x,z+Math.sin(col*.28+z*.012)*20+(s.random()-.5)*7,s.random()<.06+phase*.065?'heavy':'swarm');}
}
function burst(s,x,z,color,n=5){for(let i=0;i<n&&s.particles.length<170;i++)s.particles.push({x,z,vx:(s.random()-.5)*130,vz:(s.random()-.5)*130,life:.25+s.random()*.3,color});}
function kill(s,e){if(e.dead)return;e.dead=true;s.kills++;s.tension=Math.min(100,s.tension+.72);if(s.kills%24===0)s.power=Math.min(99,s.power+1);burst(s,e.x,e.z,e.type==='heavy'?'#ffb478':'#94e6cc',2);}
function seam(s,x=s.x){
 const radius=22*s.width;let mass=0,count=0;
 for(const e of s.enemies)if(!e.dead&&e.z>s.distance+22&&e.z<s.distance+242&&Math.abs(e.x-x)<radius){count++;mass+=e.type==='heavy'?2:1;}
 for(const f of s.fronts)if(!f.breached&&f.z>s.distance&&f.z<s.distance+270&&((f.open<=0&&!f.held)||Math.abs(x-f.x)>33))mass+=24;
 return{mass,count,ready:mass<=7,clarity:clamp(Math.round(100-Math.max(0,mass-7)*5),0,100),radius};
}
const choices=[
 {name:'收束成矛',op:'伤害 ×1.28 / 宽度 ÷1.28',factor:1/1.28,description:'更窄、更深，容易凿穿缺口'},
 {name:'展开成翼',op:'宽度 ×1.28 / 伤害 ÷1.28',factor:1.28,description:'更宽、击退更强，压住两侧'},
];
function formationPreview(s,side){const width=clamp(s.width*choices[side].factor,.55,1.8);return{width,damage:1/width};}
function chooseFormation(s,side){if(!s.choice)return false;const p=formationPreview(s,side);s.width=p.width;s.history.push(choices[side].name);s.choice=null;note(s,choices[side].name+'：伤害 ×'+p.damage.toFixed(2)+' / 宽度 ×'+p.width.toFixed(2));return true;}
function rush(s){
 if(s.mode!=='play'||s.dash||s.cooldown>0||s.tension<32)return false;
 const gap=seam(s),clean=gap.ready;let length=clean?240:110;const blocking=s.fronts.find(f=>!f.breached&&f.z>s.distance&&f.z<=s.distance+length&&(f.open<=0||Math.abs(s.x-f.x)>33));if(blocking)length=Math.max(0,blocking.z-s.distance-32);
 s.tension-=32;s.cooldown=5.4;s.invulnerable=1.1;s.pulse=.7;
 s.dash={from:s.distance,to:s.distance+length,age:0,duration:.72,clean,x:s.x};
 if(clean)for(const f of s.fronts)if(!f.breached&&f.open>0&&f.z>s.dash.from&&f.z<=s.dash.to){f.held=true;f.holderX=f.x;}
 if(clean){s.cleanRushes++;s.streak++;s.hull=Math.min(100,s.hull+3);s.rear=Math.max(0,s.rear-18);s.power=Math.min(99,s.power+2);note(s,'墨墨开路，咕咕拉弦！破浪 +240','#a7ffe1');}
 else{s.hardRushes++;s.streak=0;const loss=Math.min(44,13+gap.mass*.65);s.hull=Math.max(0,s.hull-loss);note(s,blocking?'撞上潮脊！先击碎橙色缝眼':'缺口未通，硬闯受伤！只推进 110','#ffb09a');if(s.hull===0){s.mode='lose';s.reason='连续硬闯敌潮，心弦被压断';}}
 return true;
}
function fire(s){
 const count=4+tier(s.power)*2,fan=18*s.width,damage=(9+s.power*.04)/s.width;
 const front=s.fronts.find(f=>!f.breached&&f.z>s.distance&&f.z<s.distance+325);
 const candidates=s.enemies.filter(e=>!e.dead&&e.z>s.distance+10&&e.z<s.distance+325&&(!front||e.z<front.z)).sort((a,b)=>a.z-b.z);
 for(let i=0;i<count;i++){
  const start=s.x+(i%2?1:-1)*19*s.width,spread=(i-(count-1)/2)*fan;
  let hits=0,tx=s.x+spread,tz=s.distance+325;
  for(const e of candidates){if(e.dead)continue;const along=(e.z-s.distance)/325,rayx=start+(tx-start)*along;if(Math.abs(e.x-rayx)>8)continue;
   e.hp-=damage;e.z+=2.2*s.width;if(e.hp<=0)kill(s,e);hits++;tz=e.z;if(e.type==='heavy'&&e.hp>0)break;if(hits>=2+tier(s.power))break;
  }
  if(front&&hits<2+tier(s.power)){const along=(front.z-s.distance)/325,hitx=start+(tx-start)*along;tz=front.z;if(front.open<=0&&!front.held&&Math.abs(hitx-front.x)<29){front.hp-=damage;if(front.hp<=0){front.open=3.6;burst(s,front.x,front.z,'#ffd89e',30);note(s,'缝眼破裂！裂口只维持 3.6 秒，拉弦向前！','#b1ffdc');}}}
  if(s.traces.length<130)s.traces.push({x:start,z:s.distance+15,tx,tz,life:.13,color:tier(s.power)>0?'#ffdf9d':'#a5f9df'});
 }
}
function crowd(s,dt){
 s.grid.fill(0);const rangeStart=s.distance-90;
 for(const e of s.enemies){const xx=clamp(Math.floor(e.x/14),0,29),zz=clamp(Math.floor((e.z-rangeStart)/18),0,51);s.grid[zz*30+xx]++;}
 const crest=.5+.5*Math.sin(s.time*.72),speed=39+s.phase*8+crest*22;
 let contacts=0;
 for(const e of s.enemies){if(e.dead)continue;e.phase+=dt;e.stun=Math.max(0,e.stun-dt);
  if(e.stun<=0){const xx=clamp(Math.floor(e.x/14),1,28),zz=clamp(Math.floor((e.z-rangeStart)/18),0,51),index=zz*30+xx;
   const disperse=clamp((s.grid[index-1]-s.grid[index+1])*3,-14,14);
   const close=e.z<s.distance+210?clamp((s.x-e.x)*.09,-14,14):Math.sin(e.phase+s.time*.25)*6;
   e.x=clamp(e.x+(disperse+close)*dt,15,405);e.z-=speed*dt*(e.type==='heavy'?.75:1);
  }
  if(s.dash&&e.z>s.distance-28&&e.z<s.distance+55){const dx=e.x-s.dash.x;if(Math.abs(dx)<29*s.width){kill(s,e);continue;}if(Math.abs(dx)<90){e.x=clamp(e.x+Math.sign(dx)*90*dt,15,405);e.stun=.45;}}
  if(e.z<s.distance+16&&e.z>s.distance-20&&Math.abs(e.x-s.x)<28*s.width){contacts+=e.type==='heavy'?2:1;if(s.invulnerable<=0){e.z=s.distance+17;e.hp-=35*dt;if(e.hp<=0)kill(s,e);}}
  if(e.z<s.distance-85){e.dead=true;s.rear=Math.min(100,s.rear+.14);}
 }
 if(s.invulnerable<=0)s.hull=Math.max(0,s.hull-Math.min(16,contacts)*.34*dt-Math.max(0,s.rear-35)*.025*dt);
 s.enemies=s.enemies.filter(e=>!e.dead);
}
function step(s,dt){
 if(s.mode!=='play')return;dt=clamp(dt,0,.04);s.time+=dt;
 const squeeze=Math.max(0,s.rear-45)*.35;const edge=Math.max(29,22*s.width+18);s.x+=(clamp(s.target,edge+squeeze,W-edge-squeeze)-s.x)*(1-Math.exp(-15*dt));
 s.footTimer-=dt;if(s.footTimer<=0){s.footTimer=.12;s.footprints.push({x:s.x+(Math.floor(s.time*8)%2?10:-10),z:s.distance-10,life:2});if(s.footprints.length>45)s.footprints.shift();}for(const p of s.footprints)p.life-=dt;s.footprints=s.footprints.filter(p=>p.life>0);
 s.cooldown=Math.max(0,s.cooldown-dt);s.invulnerable=Math.max(0,s.invulnerable-dt);s.pulse=Math.max(0,s.pulse-dt);
 for(const a of s.traces)a.life-=dt;s.traces=s.traces.filter(a=>a.life>0);
 for(const p of s.particles){p.x+=p.vx*dt;p.z+=p.vz*dt;p.life-=dt;}s.particles=s.particles.filter(p=>p.life>0);
 for(const n of s.notices)n.life-=dt;s.notices=s.notices.filter(n=>n.life>0);
 if(s.dash){const d=s.dash;d.age+=dt;const f=clamp(d.age/d.duration,0,1);s.distance=d.from+(d.to-d.from)*(1-Math.pow(1-f,2));s.x+=(d.x-s.x)*(1-Math.exp(-30*dt));if(f>=1)s.dash=null;}
 else{s.distance+=11*dt;const wall=s.fronts.find(f=>!f.breached&&!f.held&&f.z>s.distance-30);if(wall&&s.distance>wall.z-30)s.distance=wall.z-30;}
 for(const f of s.fronts){f.x=f.held?f.holderX:clamp(f.baseX+Math.sin(s.time*.65+f.phase)*20,48,372);if(f.open>0){f.open-=dt;if(f.open<=0&&!f.breached&&!f.held){f.hp=f.max*.55;note(s,'裂口合拢了，再打一次缝眼','#ffb09a');}}if(!f.breached&&s.distance>=f.z){f.breached=true;f.held=false;note(s,'潮脊被甩在身后！继续向前','#a7ffe1');}}
 s.camera+=(s.distance-s.camera)*(1-Math.exp(-(s.dash?4:9)*dt));
 const phase=Math.min(2,Math.floor(s.distance/1200));if(phase!==s.phase){s.phase=phase;s.rear=Math.max(0,s.rear-8);note(s,phase===1?'进入赤潮：重甲正在填住裂口':'最后的白潮！抓住缺口，一口气冲出去','#ffbd9e');for(let i=0;i<6;i++)spawnRow(s,s.distance+350+i*27,phase);}
 if(s.distance>=s.nextChoice&&!s.choice){s.choice={remaining:3.5};s.nextChoice+=550;}
 if(s.choice){s.choice.remaining-=dt;if(s.choice.remaining<=0)chooseFormation(s,s.x<210?0:1);}
 s.spawn-=dt;if(s.spawn<=0){s.spawn=.42-s.phase*.025;spawnRow(s,s.distance+560+Math.sin(s.time)*22);}
 s.fire-=dt;if(s.fire<=0){s.fire=.13;fire(s);}
 crowd(s,dt);
 if(s.hull<=0){s.mode='lose';s.reason='前潮压住矛头，后潮合拢了退路';}
 else if(s.distance>=GOAL){s.mode='win';s.reason='把三重敌潮撕成一条路，两个人一起冲了出去';}
 else if(s.time>=LIMIT){s.mode='lose';s.reason='停留太久，整片潮墙合拢；需要主动穿过缺口';}
 s.peak=Math.max(s.peak,s.enemies.length);
 const level=tier(s.power);if(level!==s.weaponTier){s.weaponTier=level;note(s,'心弦进化：'+weapons[level]);}
}

// Native Touch Events are the phone's primary input. No pointer capture.
// Track one movement finger; the skill button may use a second finger independently.
function bindInput({area,canvas,skill,host=window,active,onMove,onSkill}){
 let finger=null,mouse=false,lastTouch=-Infinity,lastSkillTouch=-Infinity;
 const move=clientX=>{if(!active())return;const r=canvas.getBoundingClientRect();if(r.width)onMove((clientX-r.left)*420/r.width);};
 const ignored=target=>!!target?.closest?.('button,#overlay,#top');
 const find=(list,id)=>Array.from(list||[]).find(t=>t.identifier===id);
 function reset(){finger=null;mouse=false;}
 area.addEventListener('touchstart',e=>{if(finger!==null&&e.touches&&!find(e.touches,finger))finger=null;if(!active()||finger!==null||ignored(e.target))return;const t=e.changedTouches[0];if(!t)return;finger=t.identifier;lastTouch=Date.now();move(t.clientX);if(e.cancelable)e.preventDefault();},{passive:false});
 host.addEventListener('touchmove',e=>{if(finger===null||!active())return;const t=find(e.touches,finger);if(t){move(t.clientX);if(e.cancelable)e.preventDefault();}},{passive:false,capture:true});
 const finish=e=>{if(finger!==null&&(find(e.changedTouches,finger)||(e.touches&&!find(e.touches,finger)))){finger=null;lastTouch=Date.now();}};
 host.addEventListener('touchend',finish,{passive:true,capture:true});
 host.addEventListener('touchcancel',finish,{passive:true,capture:true});
 skill.addEventListener('touchstart',e=>{lastTouch=Date.now();lastSkillTouch=Date.now();if(e.cancelable)e.preventDefault();e.stopPropagation();if(active()&&!skill.disabled)onSkill();},{passive:false});
 skill.addEventListener('click',()=>{if(Date.now()-lastSkillTouch>700&&active())onSkill();});
 area.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||Date.now()-lastTouch<800||!active()||ignored(e.target))return;mouse=true;move(e.clientX);});
 host.addEventListener('pointermove',e=>{if(mouse&&active())move(e.clientX);});
 host.addEventListener('pointerup',()=>mouse=false);
 host.addEventListener('pointercancel',()=>mouse=false);
 host.addEventListener('blur',reset);
 return {reset,trackedFinger:()=>finger};
}

const canvas=document.querySelector('#c'),g=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),controls=document.querySelector('#controls'),skill=document.querySelector('#skill');
let s=createGame(),view='menu',keys={},last=0,freeze=false,hidden=false,muted=true,audio,best=0;
try{best=+localStorage.getItem('fr09best')||0;}catch{}
const C={mint:'#9ffff0',gold:'#ffda9e',coral:'#ffad99',ink:'#12313a',pale:'#e8f4df'};
const box=(x,y,w,h,c,r=0)=>{g.fillStyle=c;g.beginPath();g.roundRect(x,y,w,h,r);g.fill();};
const circle=(x,y,r,c)=>{g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();};
const line=(x,y,xx,yy,c,w=1)=>{g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(xx,yy);g.stroke();};
function text(a,x,y,size=12,color=C.pale,align='center'){g.fillStyle=color;g.font=`800 ${size}px system-ui`;g.textAlign=align;g.fillText(a,x,y);}
function resize(){const d=Math.min(devicePixelRatio||1,2);canvas.width=W*d;canvas.height=H*d;g.setTransform(d,0,0,d,0,0);}resize();addEventListener('resize',resize);
const screen=z=>550-(z-s.camera)*.79;
// Original procedural sprites are cached once; crowd rendering uses drawImage, not hundreds of paths.
const sprites={};
for(const type of ['swarm','heavy']){const c=document.createElement('canvas');c.width=c.height=40;const q=c.getContext('2d');q.fillStyle='#05262a70';q.beginPath();q.ellipse(20,29,14,7,0,0,Math.PI*2);q.fill();q.fillStyle=type==='heavy'?'#b4b4a4':'#438e85';q.beginPath();q.moveTo(8,25);q.quadraticCurveTo(5,3,19,5);q.quadraticCurveTo(35,1,33,24);q.lineTo(29,32);q.lineTo(23,28);q.lineTo(18,33);q.lineTo(12,28);q.fill();q.fillStyle=type==='heavy'?'#545d66':'#1b5b60';q.fillRect(10,12,20,7);q.fillStyle=type==='heavy'?'#ffc38e':'#c1ffdc';q.fillRect(13,14,4,3);q.fillRect(24,14,4,3);if(type==='heavy'){q.fillStyle='#d7c0ab';q.fillRect(16,6,7,4);q.fillRect(11,25,18,5);}sprites[type]=c;}

 }

function render(){ground();sea();fronts();
 const playerY=screen(s.distance),span=22*s.width,run=s.dash?0:Math.sin(s.time*20)*2;
 for(const t of s.traces){const f=1-t.life/.13,yy=screen(t.z+(t.tz-t.z)*f),xx=t.x+(t.tx-t.x)*f;g.globalAlpha=clamp(t.life*10,0,1);line(xx,yy,xx+(t.tx-t.x)*.2,yy-(t.tz-t.z)*.79*.18,t.color,2);}

 if(view!=='menu'){

 }
 if(s.pulse>0){g.globalAlpha=s.pulse*.5;g.strokeStyle=C.gold;g.lineWidth=5;g.beginPath();g.ellipse(s.x,playerY,35+(1-s.pulse)*120,17+(1-s.pulse)*45,0,0,Math.PI*2);g.stroke();g.globalAlpha=1;}
 // Persistent forward progress is the hero of the dashboard.
 box(0,0,420,125,'#102c39f5');text('FIRE / RUSH',17,24,11,C.mint,'left');text('心弦裂潮 V0.9',17,44,10,'#a3c7c8','left');text(Math.min(GOAL,Math.floor(s.distance))+' / '+GOAL,398,72,23,C.gold,'right');

 text(['01 / 青潮起浪','02 / 赤潮收拢','03 / 白潮破晓'][s.phase],18,147,11,C.mint,'left');text(weapons[tier(s.power)],400,147,11,C.gold,'right');

function show(html){overlay.innerHTML=html;overlay.hidden=false;controls.hidden=true;}
function menu(){view='menu';show(`<div class="eyebrow">V0.9 · CUT A SEAM / PULL FORWARD</div><h1 class="title">火力突围<br><em>心弦裂潮</em></h1><p class="subtitle">把整片敌潮，撕成两个人的路。</p><div class="rule"><b>墨墨凿开缝眼，咕咕拉着你冲进裂口。</b><br>① 左右滑动，向橙色缝眼集中火力。<br>② 潮脊裂开后，趁 <b>3.6 秒</b> 窗口点右下角拉弦。<br>③ 穿过干净缺口，<b>冲出 240 距离</b>；硬闯会受伤。<br>④ 敌潮从两侧回涌，停留越久，退路越窄。<br>收束成矛或展开成翼，让心弦变成不同形状。</div><button class="primary" id="start">牵紧我，一起冲 →</button><p class="fine">原生触摸 · 越界持续控制 · 松手可继续<br>独立双指拉弦 · A/D 移动 · 空格冲锋 · P 暂停<br>前进目标 3600 · 最高击破 ${best} · 零外部素材下载</p>`);document.querySelector('#start').onclick=()=>start();}
function start(seed){s=createGame(typeof seed==='number'?seed:Date.now());view='play';overlay.hidden=true;controls.hidden=false;input.reset();keys={};last=performance.now();}
function end(){view=s.mode;input.reset();best=Math.max(best,s.kills);try{localStorage.setItem('fr09best',best);}catch{}show(`<div class="eyebrow">${s.mode==='win'?'WE TORE OPEN THE DAWN':'THE TIDE CLOSED IN'}</div><h1 class="title">${s.mode==='win'?'天亮了，手还牵着':'潮合拢了，再冲一次'}</h1><div class="stats"><div>前进<strong>${Math.floor(s.distance)}</strong></div><div>破浪<strong>${s.cleanRushes}</strong></div><div>硬闯<strong>${s.hardRushes}</strong></div></div><div class="rule">${s.reason}<br>${s.hardRushes>2?'别只按冲锋：先把正前方凿空，再看准橙色缝眼。':'潮脊开口后只剩 3.6 秒；留好拉弦蓄力和冷却，才能抓住窗口。'}<br>击破 ${s.kills} · 用时 ${Math.floor(s.time)}s<br>阵型 ${s.history.join(' / ')||'尚未调整'}</div><button class="primary" id="again">换一条裂口，再冲 ↻</button><button class="secondary" id="back">返回出发点</button>`);document.querySelector('#again').onclick=()=>start();document.querySelector('#back').onclick=menu;}
function pause(){if(view==='pause'){resume();return;}if(view!=='play')return;view='pause';input.reset();keys={};show('<div class="eyebrow">STILL HOLDING HANDS</div><h1 class="title">等你，潮也停了</h1><div class="rule">战场已暂停。<br>收束更容易穿透缝眼，展开能压住更多侧翼。<br>右下角显示风险：缺口未通时硬闯会损伤心弦。</div><button class="primary" id="resume">继续向前 →</button><button class="secondary" id="restart">重新出发</button>');document.querySelector('#resume').onclick=resume;document.querySelector('#restart').onclick=()=>start();}
function resume(){view='play';overlay.hidden=true;controls.hidden=false;last=performance.now();}
function sound(){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),a=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(130,audio.currentTime);o.frequency.exponentialRampToValueAtTime(600,audio.currentTime+.2);a.gain.setValueAtTime(.035,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.3);o.connect(a).connect(audio.destination);o.start();o.stop(audio.currentTime+.3);}catch{}}
function useSkill(){if(rush(s))sound();}
const input=bindInput({area:document.querySelector('#game'),canvas,skill,active:()=>view==='play',onMove:x=>s.target=clamp(x,29,391),onSkill:useSkill});
document.querySelector('#pause').onclick=pause;document.querySelector('#sound').onclick=()=>{muted=!muted;document.querySelector('#sound').textContent='音效 '+(muted?'OFF':'ON');sound();};
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(!e.repeat){if(e.key===' '&&view==='play')useSkill();if(e.key.toLowerCase()==='p')pause();}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>keys={});document.addEventListener('visibilitychange',()=>{hidden=document.hidden;input.reset();keys={};last=performance.now();});
function frame(now){const dt=clamp((now-last)/1000,0,.04);last=now;if(view==='play'&&!freeze&&!hidden){const d=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(d)s.target=clamp(s.target+d*370*dt,29,391);step(s,dt);if(s.mode!=='play')end();}const gap=seam(s);skill.disabled=!!s.dash||s.cooldown>0||s.tension<32;skill.classList.toggle('risk',!gap.ready&&!skill.disabled);skill.querySelector('b').textContent=s.dash?'牵紧，一起向前！':s.cooldown>0?'拉弦冷却 '+s.cooldown.toFixed(1)+'s':s.tension<32?'蓄力 '+Math.floor(s.tension)+' / 32':gap.ready?'牵手 · 向前破浪':'缺口未通 · 硬闯';skill.querySelector('small').textContent=s.dash?'心弦正在把两人拉进缺口':gap.ready?'干净缺口：推进 240':'硬闯推进有限，会受伤';render();requestAnimationFrame(frame);}
