function route(s,entry){let x=entry*2,y=3,dx=0,dy=-1;const points=[{x,y}],hits=[],local=s.cores.map(c=>c.dead),seen=new Set();let blocked=false;
 for(let i=0;i<45;i++){x+=dx;y+=dy;points.push({x,y});if(x<0||x>4||y<0||y>3)break;const key=x+','+y+','+dx+','+dy;if(seen.has(key)){blocked=true;break;}seen.add(key);
  const core=s.cores.find(c=>c.x===x&&c.y===y);if(core&&!local[core.id]){if(core.id>=2&&!(local[0]&&local[1])){blocked=true;break;}local[core.id]=true;hits.push({id:core.id,at:points.length-1});}

function step(s,dt){if(s.mode!=='play')return;dt=clamp(dt,0,.04);s.time+=dt;s.waveAge+=dt;s.x+=(clamp(s.target,66,354)-s.x)*(1-Math.exp(-13*dt));s.energy=Math.min(100,s.energy+12*dt);s.advance=Math.max(0,s.advance-dt);

// A one-way per-page pixel budget: avoid repeated quality oscillation on slow phones.
class RenderBudget{
 constructor(dpr=1){this.scale=Math.max(1,Math.min(dpr,1.5));this.seconds=0;this.slow=0;}
 observe(elapsed,active){
  if(!active){this.seconds=0;this.slow=0;return false;}
  this.seconds+=Math.min(elapsed,.1);if(elapsed>.025)this.slow++;
  if(this.seconds<1)return false;
  const before=this.scale;if(this.slow>=9)this.scale=Math.max(1,this.scale-.25);
  this.seconds=0;this.slow=0;return this.scale!==before;
 }
}
