 for(let i=0;i<9;i++){const z=980+i*480,r=road(z);s.obstacles.push({z,x:r.center+((i+((seed>>>0)%2))%2?64:-64),width:i%3===1?76:96,type:i%3===1?'cart':'barrier',phase:i*1.7+((seed>>>0)%13)*.3,passed:false});}

const rushCost=()=>45;
const skillCost=()=>45;
function rush(s){

 s.tension-=45;s.chain=s.chainWindow>0?s.chain+1:1;s.chainWindow=0;

function fire(s){
 const count=4+tier(s.power)*2,fan=18*s.width,damage=(12+s.power*.06)/s.width;
 const front=s.fronts.find(f=>!f.breached&&f.z>s.distance&&f.z<s.distance+325);

}
function crowd(s,dt){

 for(const e of s.enemies){const xx=clamp(Math.floor(e.x/14),0,29),zz=clamp(Math.floor((e.z-rangeStart)/18),0,51);s.grid[zz*30+xx]++;}

  if(s.dash&&e.z>s.distance-28&&e.z<s.distance+55){const dx=e.x-s.dash.x;if(Math.abs(dx)<29*s.width){kill(s,e);continue;}if(Math.abs(dx)<90){e.x=clamp(e.x+Math.sign(dx)*90*dt,15,405);e.stun=.45;}}
  if(e.z<s.distance+16&&e.z>s.distance-20&&Math.abs(e.x-s.x)<28*s.width){contacts+=e.type==='heavy'?2:1;if(s.invulnerable<=0){e.z=s.distance+17;e.hp-=35*dt;if(e.hp<=0)kill(s,e);}}

}
function result(s){

}
function step(s,dt){

 s.footTimer-=dt;if(s.footTimer<=0){s.footTimer=.12;s.footprints.push({x:s.x+(Math.floor(s.time*8)%2?10:-10),z:s.distance-10,life:2});if(s.footprints.length>45)s.footprints.shift();}for(const p of s.footprints)p.life-=dt;s.footprints=s.footprints.filter(p=>p.life>0);
 s.tension=Math.min(100,s.tension+10*dt);s.chainWindow=Math.max(0,s.chainWindow-dt);for(const w of s.wakes)w.life-=dt;s.wakes=s.wakes.filter(w=>w.life>0);for(const r of s.rings)r.life-=dt;s.rings=s.rings.filter(r=>r.life>0);
 s.tailwind=Math.max(0,s.tailwind-dt);s.obstacleGrace=Math.max(0,s.obstacleGrace-dt);s.impact=Math.max(0,s.impact-dt);

 if(s.dash){const d=s.dash;d.age+=dt;const f=clamp(d.age/d.duration,0,1);s.distance=d.from+(d.to-d.from)*f;d.x=s.x;if(d.wake.points.length<48)d.wake.points.push({x:s.x,z:s.distance});if(f>=1){s.dash=null;s.chainWindow=1.8;}}
 else s.distance+=(72+s.phase*7)*dt;

 const ignored=target=>!!target?.closest?.('button,#overlay,#top');
 const find=(list,id)=>Array.from(list||[]).find(t=>t.identifier===id);
 function reset(){finger=null;mouse=false;}
 area.addEventListener('touchstart',e=>{if(finger!==null&&e.touches&&!find(e.touches,finger))finger=null;if(!active()||finger!==null||ignored(e.target))return;const t=e.changedTouches[0];if(!t)return;finger=t.identifier;lastTouch=Date.now();move(t.clientX);if(e.cancelable)e.preventDefault();},{passive:false});

 const finish=e=>{if(finger!==null&&(find(e.changedTouches,finger)||(e.touches&&!find(e.touches,finger)))){finger=null;lastTouch=Date.now();}};

 skill.addEventListener('touchstart',e=>{lastTouch=Date.now();lastSkillTouch=Date.now();if(e.cancelable)e.preventDefault();e.stopPropagation();if(active()&&!skill.disabled)onSkill();},{passive:false});
 skill.addEventListener('click',()=>{if(Date.now()-lastSkillTouch>700&&active())onSkill();});
 area.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||Date.now()-lastTouch<800||!active()||ignored(e.target))return;mouse=true;move(e.clientX);});
 host.addEventListener('pointermove',e=>{if(mouse&&active())move(e.clientX);});

// A one-way per-page pixel budget: avoid repeated quality oscillation on slow phones.
class RenderBudget{
 constructor(dpr=1){this.scale=Math.max(1,Math.min(dpr,1.5));this.seconds=0;this.slow=0;}
 observe(elapsed,active){
  if(!active){this.seconds=0;this.slow=0;return false;}
  this.seconds+=Math.min(elapsed,.1);if(elapsed>.025)this.slow++;
  if(this.seconds<1)return false;
  const before=this.scale;if(this.slow>=9)this.scale=Math.max(1,this.scale-.25);
  this.seconds=0;this.slow=0;return this.scale!==before;
 }
}

function show(html){overlay.innerHTML=html;overlay.hidden=false;controls.hidden=true;}
function menu(){view='menu';show(`<div class="eyebrow">V0.12 · KEEP RUNNING</div><h1 class="title">火力突围<br><em>破阵狂奔</em></h1><p class="subtitle">一路跑，一路变强。</p><div class="rule"><b>左右拖动，自动开火。</b><br>咕咕的冲锋随时能用，不用等缺口。<br>绕开路障，打爆灯蛹，击败堵住出口的封港蟹！</div><button class="primary" id="start">开跑 →</button><p class="fine">最高路线得分 ${bestScore}<br>原生触摸 · 可松手重按 · 独立双指冲锋<br>音效可开启 · 无需下载外部素材</p>`);document.querySelector('#start').onclick=()=>start();}
function start(seed){s=createGame(typeof seed==='number'?seed:Date.now());view='play';overlay.hidden=true;controls.hidden=false;input.reset();keys={};lastPop=0;last=performance.now();}
function end(){view=s.mode;input.reset();const finish=result(s),record=finish.score>bestScore;bestScore=Math.max(bestScore,finish.score);best=Math.max(best,s.kills);try{localStorage.setItem('fr012best',best);localStorage.setItem('fr012score',bestScore);}catch{}
 show(`<div class="eyebrow">${record?'新的个人纪录 · ':''}${finish.grade} / COAST ROAD</div><h1 class="title">${s.mode==='win'?'冲出潮水，奔向海风':'差一点，再牵紧一点'}</h1><div class="stats"><div>路线得分<strong>${finish.score}</strong></div><div>漂亮擦边<strong>${s.nearMisses}</strong></div><div>撞障<strong>${s.obstacleHits}</strong></div></div><div class="rule">${s.reason}<br>前进 ${Math.floor(s.distance)} / 5400 · 用时 ${Math.floor(s.time)}s<br>击破 ${s.kills} · 灯蛹引爆 ${s.explosions} · 绕行 ${s.dodged}/9<br><b>${s.obstacleHits?'提前看地面警示，绕向空侧继续跑。':s.nearMisses<4?'下次试着贴近路障绕过，攒尾风，挑战 S 级。':'漂亮！再换一条海岸线，看看还能冲多快。'}</b><br>个人最高 ${bestScore}</div><button class="primary" id="again">换一条海岸，再冲 ↻</button><button class="secondary" id="practice">重跑这条路 · 练习擦边</button><button class="secondary" id="back">返回出发点</button>`);

}
function pause(){if(view==='pause'){resume();return;}if(view!=='play')return;view='pause';input.reset();keys={};show('<div class="eyebrow">STILL HOLDING HANDS</div><h1 class="title">等你，潮也停了</h1><div class="rule">战场已暂停。<br>聚束钻头穿透前方重甲，回旋双翼清扫侧翼。<br>冲锋消耗 45 蓄力，击杀与时间都会回充。</div><button class="primary" id="resume">继续向前 →</button><button class="secondary" id="restart">重新出发</button>');document.querySelector('#resume').onclick=resume;document.querySelector('#restart').onclick=()=>start();}
function resume(){view='play';overlay.hidden=true;controls.hidden=false;last=performance.now();}
function sound(kind='rush'){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),a=audio.createGain();o.type='triangle';o.frequency.setValueAtTime(kind==='pop'?80:kind==='wind'?440:130,audio.currentTime);o.frequency.exponentialRampToValueAtTime(kind==='pop'?35:kind==='wind'?880:600,audio.currentTime+.2);a.gain.setValueAtTime(.035,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.3);o.connect(a).connect(audio.destination);o.start();o.stop(audio.currentTime+.3);}catch{}}
function useSkill(){if(rush(s))sound();}
