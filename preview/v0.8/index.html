:11px;color:#a3c6b0}.stats strong{font-size:24px;display:block;color:#f5d79d}#controls{position:absolute;bottom:max(2%,env(safe-area-inset-bottom));right:3%;width:35%;pointer-events:none}#controls span{display:none}#skill{pointer-events:auto;width:100%;min-height:58px;background:#f2c67f;color:#273d38;border:2px solid #ffe7b0;border-radius:12px;box-shadow:0 4px 0 #8a704c;padding:7px 4px}#skill b{font-size:14px;display:block}#skill small{font-size:9px;display:block;margin-top:3px}#skill:disabled{background:#354d49;color:#9bb2a4;border-color:#5b7466;box-shadow:0 3px 0 #233b37}button:focus-visible{outline:3px solid white}@container(max-height:650px){#overlay{padding:6%;gap:8px}.eyebrow{font-size:8px;letter-spacing:2px}.title{font-size:32px}.subtitle{font-size:12px}.rule{font-size:10px;padding:8px;line-height:1.7}.primary{font-size:15px;padding:12px}.fine{font-size:9px}.secondary{padding:9px}.stats strong{font-size:20px}}
</style></head><body><main id="game"><canvas id="c" aria-label="夺塔战场：左右滑动选择攻城路线"></canvas><div id="top"><button id="pause" aria-label="暂停">Ⅱ</button><button id="sound">音效 OFF</button></div><section id="overlay" aria-live="polite"></section><div id="controls" hidden><span>全屏左右滑动 · 先拆侧塔</span><button id="skill"><b>咕咕 · 破阵</b><small>同心 45 起释放</small></button></div></main><script type="module">const W=420,H=760,LANES=[80,210,340],LIMIT=200;
const clamp=(n,a,b)=>Math.max(a,Math.min(b,n));
function rng(seed){return()=>{let t=seed+=0x6D2B79F5;t=Math.imul(t^t>>>15,t|1);t^=t+Math.imul(t^t>>>7,t|61);return((t^t>>>14)>>>0)/4294967296;};}
const tier=p=>p>=70?3:p>=40?2:p>=26?1:0;
const guns=['双生点射','四线连射','六线穿甲','八翼攻城'];
function laneOf(x){return x<145?0:x>275?2:1;}
function note(s,text,color='#ffe5b0'){s.notices.push({text,color,life:3});if(s.notices.length>2)s.notices.shift();}
function createGame(seed=Date.now()){
 const s={seed,random:rng(seed),mode:'play',time:0,sector:0,x:210,target:210,power:22,base:100,kills:0,bond:30,cooldown:0,pulse:0,invulnerable:0,fire:0,spawn:1.2,mortar:5,surge:8,alert:0,transition:0,nextSupply:18,supply:null,history:[],towers:[],enemies:[],traces:[],particles:[],impacts:[],raids:[],notices:[],serial:0,peak:0,captures:0,recaptures:0,reason:'',slow:0,weaponTier:0};
 makeSector(s);note(s,'先拆侧塔 → 留在该侧占领 → 两塔断电，集火主堡');return s;
}
function makeSector(s){
 const hp=620+s.sector*210;
 s.towers=[{id:'left',lane:0,x:80,y:300,hp,max:hp,owner:'enemy',capture:0,fire:0,guard:0},{id:'right',lane:2,x:340,y:300,hp,max:hp,owner:'enemy',capture:0,fire:0,guard:0},{id:'core',lane:1,x:210,y:203,hp:1700+s.sector*700,max:1700+s.sector*700,owner:'enemy',capture:0,fire:0,guard:0}];
 s.enemies=[];s.traces=[];s.impacts=[];s.raids=[];s.spawn=1.3;s.mortar=5;s.surge=7;
 for(let i=0;i<80+s.sector*10;i++)spawnEnemy(s,i%3,140+s.random()*290,i%6===0?'shield':'swarm');
}
function spawnEnemy(s,lane,y=160,type='swarm'){
 if(s.enemies.length>=220)return;const hp=type==='shield'?40:type==='sapper'?20:12+s.sector*2;
 s.enemies.push({id:++s.serial,lane,x:LANES[lane]+(s.random()-.5)*86,y,hp,max:hp,type,r:type==='shield'?10:7,attack:.4+s.random()*.4,stun:0});
}
const supplies=[
 [{name:'扩编',op:'+14',kind:'add',v:14,detail:'火力 +14 · 敌潮加速',alert:1},{name:'加固',op:'−8',kind:'pay',v:8,detail:'火力 −8 · 基地 +22 / 守塔 +60',heal:22,guard:60}],
 [{name:'过载',op:'×1.5',kind:'multiply',v:1.5,detail:'火力 ×1.5 · 敌潮加速',alert:1},{name:'共筑',op:'÷2',kind:'divide',v:2,detail:'火力减半 · 全塔装甲 +120',guard:120}],
 [{name:'拆借',op:'+18',kind:'add',v:18,detail:'火力 +18 · 基地 −15',damage:15},{name:'回援',op:'−12',kind:'pay',v:12,detail:'火力 −12 · 基地 +30',heal:30}],
];
function supplyValue(power,r){return clamp(Math.floor(r.kind==='multiply'?power*r.v:r.kind==='divide'?power/r.v:r.kind==='pay'?power-r.v:power+r.v),8,99);}
function chooseSupply(s,side){if(!s.supply)return false;const r=s.supply.options[side];if(r.kind==='pay'&&s.power-r.v<8){note(s,'火力不足，补给取消；没有扣费','#ffaaa0');s.supply=null;return false;}const before=s.power;s.power=supplyValue(s.power,r);s.base=clamp(s.base+(r.heal||0)-(r.damage||0),0,100);s.alert=Math.min(4,s.alert+(r.alert||0));for(const t of s.towers)if(t.id!=='core')t.guard=Math.min(180,t.guard+(r.guard||0));s.history.push(r.name);s.supply=null;note(s,r.name+'：'+before+' → '+s.power);if(s.base<=0){s.mode='lose';s.reason='拆借透支了最后的基地装甲';}return true;}
function burst(s,x,y,color,n=10){for(let i=0;i<n&&s.particles.length<180;i++)s.particles.push({x,y,vx:(s.random()-.5)*180,vy:(s.random()-.5)*180,life:.25+s.random()*.35,color});}
function trace(s,x,y,tx,ty,color='#ffe4ac',width=2){if(s.traces.length<150)s.traces.push({x,y,tx,ty,color,width,life:.1});}
function kill(s,e){if(e.dead)return;e.dead=true;s.kills++;s.bond=Math.min(100,s.bond+1);if(s.kills%20===0)s.power=Math.min(99,s.power+1);burst(s,e.x,e.y,e.type==='sapper'?'#ffb45b':'#c0e5a7',3);}
function damageEnemy(s,e,d){if(e.dead)return;e.hp-=d;if(e.hp<=0)kill(s,e);}
function pulse(s){
 if(s.mode!=='play'||s.transition>0||s.cooldown>0||s.bond<45)return false;
 const charged=s.bond>=100;s.bond=0;s.cooldown=5;s.pulse=.65;s.pulseRadius=charged?270:185;s.invulnerable=1.2;
 for(const e of s.enemies){if(Math.hypot((e.x-s.x)*.9,(e.y-420)*.7)>(charged?270:185))continue;e.stun=2.2;damageEnemy(s,e,charged?42:22);if(!e.dead)e.y=Math.max(170,e.y-42);}
 // Resonance creates a capture opening but cannot capture a tower from afar.
 for(const t of s.towers)if(t.owner==='enemy'&&t.id!=='core'&&Math.abs(t.x-s.x)<(charged?240:150))damageTower(s,t,charged?65:30);
 s.slow=2.2;note(s,charged?'咕咕：满同心！破盾清场，趁现在夺塔！':'咕咕：震开了！趁现在占塔！','#a4f0d6');return true;
}
function damageTower(s,t,damage){
 if(t.owner!=='enemy'||t.hp<=0)return;
 if(t.id==='core'){const owned=s.towers.filter(t=>t.id!=='core'&&t.owner==='ally').length;damage*=owned===2?1:owned===1?.18:0;}
 t.hp=Math.max(0,t.hp-damage);if(t.hp===0){burst(s,t.x,t.y,'#ffd497',36);if(t.id==='core'){s.transition=2;note(s,s.sector===2?'主堡崩解！突围成功':'主堡崩解！防线前推','#a5f6d2');}else{t.owner='ruin';t.capture=0;note(s,'供能塔已瘫痪：移到该侧，驻守 1.4 秒占领','#a5f6d2');}}
}
function playerFire(s){
 const lane=laneOf(s.x),level=tier(s.power),count=2+level*2;
 // Lane concentration rewards focusing a breach. Crowds screen fortifications.
 const targets=s.enemies.filter(e=>!e.dead&&Math.abs(e.x-s.x)<58+level*5).sort((a,b)=>b.y-a.y);
 const towers=s.towers.filter(t=>t.owner==='enemy'&&Math.abs(t.x-s.x)<72).sort((a,b)=>b.y-a.y);
 for(let i=0;i<count;i++){
  const target=targets.find(e=>!e.dead);if(target){const damage=(6+s.power*.085)*(target.type==='shield'&&target.stun<=0?.55:1);trace(s,s.x+(i-(count-1)/2)*13,548,target.x,target.y);damageEnemy(s,target,damage);}
  else if(towers[0]){const t=towers[0];trace(s,s.x+(i-(count-1)/2)*13,548,t.x+(s.random()-.5)*35,t.y,'#ffd594',3);damageTower(s,t,8+s.power*.12);}
  else trace(s,s.x+(i-(count-1)/2)*13,548,s.x+(i-(count-1)/2)*23,175,'#9fe5cc',1);
 }
}
function turretFire(s,t){
 const target=s.enemies.filter(e=>!e.dead&&Math.hypot(e.x-t.x,e.y-t.y)<210).sort((a,b)=>Math.hypot(a.x-t.x,a.y-t.y)-Math.hypot(b.x-t.x,b.y-t.y))[0];
 if(target){trace(s,t.x,t.y,target.x,target.y,'#8df2d4',3);damageEnemy(s,target,13+s.sector*2);}
}
function step(s,dt){
 if(s.mode!=='play')return;dt=clamp(dt,0,.04);s.time+=dt;s.x+=(clamp(s.target,30,390)-s.x)*(1-Math.exp(-17*dt));
 for(const arr of [s.traces,s.particles,s.notices])for(const a of arr){a.life-=dt;if(a.vx!=null){a.x+=a.vx*dt;a.y+=a.vy*dt;}}
 s.traces=s.traces.filter(a=>a.life>0);s.particles=s.particles.filter(a=>a.life>0);s.notices=s.notices.filter(a=>a.life>0);
 s.cooldown=Math.max(0,s.cooldown-dt);s.pulse=Math.max(0,s.pulse-dt);s.invulnerable=Math.max(0,s.invulnerable-dt);s.slow=Math.max(0,s.slow-dt);
 if(s.transition>0){s.transition-=dt;if(s.transition<=0){s.sector++;if(s.sector>=3){s.mode='win';s.reason='三座主堡倒下，墨墨与咕咕接通归途';}else{s.base=Math.min(100,s.base+14);s.power=Math.min(99,s.power+6);makeSector(s);note(s,'占领主堡：基地 +14 / 火力 +6，向前突围！');}}return;}
 if(s.time>=LIMIT){s.mode='lose';s.reason='敌方援军封路：需要更快抢塔、断电攻城';return;}
 if(s.time>=s.nextSupply&&!s.supply){s.supply={options:supplies[Math.floor((s.nextSupply-18)/25)%3],remaining:4};s.nextSupply+=25;}
 if(s.supply){s.supply.remaining-=dt;if(s.supply.remaining<=0)chooseSupply(s,s.x<210?0:1);}
 s.spawn-=dt;if(s.spawn<=0){s.spawn=Math.max(.65,1.18-s.alert*.09-s.sector*.1);for(const t of s.towers)if(t.owner==='enemy'){const n=t.id==='core'?2:3;for(let i=0;i<n;i++)spawnEnemy(s,t.lane,t.y+25+s.random()*22,s.random()<.08?'sapper':s.random()<.12?'shield':'swarm');}}
 s.surge-=dt;if(s.surge<=0){s.surge=12;const red=s.towers.filter(t=>t.owner==='enemy');for(let i=0;i<15&&red.length;i++){const t=red[i%red.length];spawnEnemy(s,t.lane,t.y+30+(i%5)*13,i%5===0?'sapper':'swarm');}for(const t of s.towers)if(t.owner==='ally')s.raids.push({lane:t.lane,remaining:2});note(s,'反扑预告：敌军将从侧翼围攻已占塔！','#ffb1a4');}
 for(const raid of s.raids){raid.remaining-=dt;if(raid.remaining<=0&&!raid.done){raid.done=true;for(let i=0;i<12;i++)spawnEnemy(s,raid.lane,255+(i%3)*13,i<3?'sapper':i<8?'shield':'swarm');}}s.raids=s.raids.filter(r=>!r.done);
 s.mortar-=dt;if(s.mortar<=0){s.mortar=6-s.sector*.5;const source=s.towers.find(t=>t.owner==='enemy');if(source)s.impacts.push({x:s.x,y:548,r:43,remaining:1.2,source:source.x});}
 s.fire-=dt;if(s.fire<=0){s.fire=.17;playerFire(s);}
 for(const t of s.towers){if(t.id==='core')continue;
  if(t.owner==='ruin'){
   const contested=s.enemies.some(e=>!e.dead&&Math.hypot(e.x-t.x,e.y-t.y)<62);
   t.contested=contested;
   if(laneOf(s.x)===t.lane&&!contested)t.capture+=dt;else t.capture=Math.max(0,t.capture-dt*.45);
   if(t.capture>=1.4){t.owner='ally';t.hp=160;t.max=160;s.captures++;s.bond=Math.min(100,s.bond+10);burst(s,t.x,t.y,'#8ff1cd',28);note(s,'咕咕架起守塔！它会替你挡住这一侧','#9cecd0');}
  }else if(t.owner==='ally'){t.fire-=dt;if(t.fire<=0){t.fire=.22;turretFire(s,t);}}
 }
 for(const e of s.enemies){if(e.dead)continue;e.stun=Math.max(0,e.stun-dt);if(e.stun>0)continue;
  const fort=s.towers.find(t=>t.owner==='ally'&&Math.abs(t.x-e.x)<73&&e.y>t.y-65&&e.y<t.y+100);
  if(fort){e.x+=(fort.x-e.x)*dt*1.5;e.y+=(fort.y+25-e.y)*dt*1.5;e.attack-=dt;if(e.attack<=0){e.attack=e.type==='sapper'?.5:.9;let hit=e.type==='sapper'?18:e.type==='shield'?5:3;
    const absorbed=Math.min(fort.guard,hit);fort.guard-=absorbed;hit-=absorbed;fort.hp-=hit;
    if(e.type==='sapper'){e.dead=true;burst(s,e.x,e.y,'#ff9f6c',8);}
    if(fort.hp<=0){fort.owner='enemy';fort.hp=280+s.sector*60;fort.max=fort.hp;fort.capture=0;s.recaptures++;note(s,'侧塔被夺回！供能重新接通','#ffb1a4');}
   }
  }else{e.y+=(e.type==='sapper'?55:e.type==='shield'?22:30+s.sector*3)*dt;e.x+=(LANES[e.lane]-e.x)*dt*.16;
   if(e.y>=540&&Math.abs(e.x-s.x)<45&&s.invulnerable<=0){s.base-=e.type==='sapper'?7:2;e.dead=true;burst(s,e.x,e.y,'#ff9f6c',3);}
   if(e.y>616){s.base-=e.type==='shield'?4:1.5;e.dead=true;}
  }
 }
 s.enemies=s.enemies.filter(e=>!e.dead);
 for(const a of s.impacts){a.remaining-=dt;if(a.remaining<=0&&!a.done){a.done=true;burst(s,a.x,a.y,'#ff9f70',20);if(Math.abs(s.x-a.x)<a.r&&s.invulnerable<=0){s.base-=10;s.invulnerable=.5;note(s,'迫击命中！留意地面红圈','#ffb1a4');}}}s.impacts=s.impacts.filter(a=>a.remaining>-.3);
 if(s.base<=0){s.base=0;s.mode='lose';s.reason='防线被压穿：敌潮冲垮了后方基地';}
 const lev=tier(s.power);if(lev!==s.weaponTier){note(s,'墨墨换装：'+guns[lev],'#ffe5b0');s.weaponTier=lev;}
 s.peak=Math.max(s.peak,s.enemies.length);
}

// Native Touch Events are the phone's primary input. No pointer capture.
// Track one movement finger; the skill button may use a second finger independently.
function bindInput({area,canvas,skill,host=window,active,onMove,onSkill}){
 let finger=null,mouse=false,lastTouch=-Infinity,lastSkillTouch=-Infinity;
 const move=clientX=>{if(!active())return;const r=canvas.getBoundingClientRect();if(r.width)onMove((clientX-r.left)*420/r.width);};
 const ignored=target=>!!target?.closest?.('button,#overlay,#top');
 const find=(list,id)=>Array.from(list||[]).find(t=>t.identifier===id);
 function reset(){finger=null;mouse=false;}
 area.addEventListener('touchstart',e=>{if(finger!==null&&e.touches&&!find(e.touches,finger))finger=null;if(!active()||finger!==null||ignored(e.target))return;const t=e.changedTouches[0];if(!t)return;finger=t.identifier;lastTouch=Date.now();move(t.clientX);if(e.cancelable)e.preventDefault();},{passive:false});
 host.addEventListener('touchmove',e=>{if(finger===null||!active())return;const t=find(e.touches,finger);if(t){move(t.clientX);if(e.cancelable)e.preventDefault();}},{passive:false,capture:true});
 const finish=e=>{if(finger!==null&&(find(e.changedTouches,finger)||(e.touches&&!find(e.touches,finger)))){finger=null;lastTouch=Date.now();}};
 host.addEventListener('touchend',finish,{passive:true,capture:true});
 host.addEventListener('touchcancel',finish,{passive:true,capture:true});
 skill.addEventListener('touchstart',e=>{lastTouch=Date.now();lastSkillTouch=Date.now();if(e.cancelable)e.preventDefault();e.stopPropagation();if(active()&&!skill.disabled)onSkill();},{passive:false});
 skill.addEventListener('click',()=>{if(Date.now()-lastSkillTouch>700&&active())onSkill();});
 area.addEventListener('pointerdown',e=>{if(e.pointerType==='touch'||Date.now()-lastTouch<800||!active()||ignored(e.target))return;mouse=true;move(e.clientX);});
 host.addEventListener('pointermove',e=>{if(mouse&&active())move(e.clientX);});
 host.addEventListener('pointerup',()=>mouse=false);
 host.addEventListener('pointercancel',()=>mouse=false);
 host.addEventListener('blur',reset);
 return {reset,trackedFinger:()=>finger};
}

const canvas=document.querySelector('#c'),g=canvas.getContext('2d'),overlay=document.querySelector('#overlay'),controls=document.querySelector('#controls'),skill=document.querySelector('#skill');
let s=createGame(),view='menu',last=0,keys={},muted=true,audio,best=0,freeze=false,hidden=false;
try{best=+localStorage.getItem('fr08best')||0;}catch{}
const C={ink:'#1b302e',mint:'#a0efd0',gold:'#ffe0a2',red:'#fa9a7b',pale:'#e8efd3'};
function box(x,y,w,h,c,r=0){g.fillStyle=c;g.beginPath();g.roundRect(x,y,w,h,r);g.fill();}
function circle(x,y,r,c){g.fillStyle=c;g.beginPath();g.arc(x,y,r,0,Math.PI*2);g.fill();}
function line(x,y,xx,yy,c,w=1){g.strokeStyle=c;g.lineWidth=w;g.beginPath();g.moveTo(x,y);g.lineTo(xx,yy);g.stroke();}
function text(a,x,y,size=12,c=C.pale,align='center'){g.fillStyle=c;g.font=`800 ${size}px system-ui`;g.textAlign=align;g.fillText(a,x,y);}

function cat(x,y,scale=1){g.save();g.translate(x,y);g.scale(scale,scale);circle(0,6,13,'#243a3b');g.fillStyle='#243a3b';g.beginPath();g.moveTo(-12,4);g.lineTo(-13,-16);g.lineTo(-2,-8);g.lineTo(11,-16);g.lineTo(13,4);g.fill();box(-9,0,6,3,C.mint,1);box(4,0,5,3,C.mint,1);box(-11,16,22,5,C.mint,2);g.restore();}

function render(){ground();box(LANES[laneOf(s.x)]-49,342,98,250,'#ffdc8b10',5);links();
 for(const raid of s.raids){const x=LANES[raid.lane];circle(x,300,51,'#f39c7c30');text('侧翼反扑 '+raid.remaining.toFixed(1)+'s',x,393,10,C.red);}
 const objects=[...s.towers.map(t=>({...t,kind:'tower',original:t})),...s.enemies.map(e=>({...e,kind:'enemy'}))].sort((a,b)=>a.y-b.y);
 for(const o of objects)if(o.kind==='tower')drawTower(o.original);else soldier(o);
 for(const a of s.impacts){const alpha=a.remaining>0?.25+Math.sin(s.time*16)*.1:.5;g.globalAlpha=alpha;circle(a.x,a.y,a.r,C.red);g.globalAlpha=1;g.strokeStyle=C.red;g.lineWidth=2;g.beginPath();g.arc(a.x,a.y,a.r,0,Math.PI*2);g.stroke();line(a.x-10,a.y,a.x+10,a.y,C.red,2);line(a.x,a.y-10,a.x,a.y+10,C.red,2);if(a.remaining>0)text('撤',a.x,a.y-52,14,C.red);}

 text('火力 '+s.power,237,73,20,C.gold,'left');text(guns[tier(s.power)],399,96,11,C.gold,'right');text('敌潮 '+s.enemies.length+' · 击破 '+s.kills,17,96,11,C.pale,'left');
 for(let i=0;i<3;i++){box(17+i*76,109,67,4,i<s.sector?C.mint:i===s.sector?C.gold:'#506252',2);}text('援军封路 '+Math.max(0,Math.ceil(LIMIT-s.time))+'s',399,116,10,C.red,'right');
 text(['01 / 青苔旧堡','02 / 熔炉堤坝','03 / 断桥母巢'][Math.min(2,s.sector)],22,167,11,C.gold,'left');text('占领 '+s.towers.filter(t=>t.owner==='ally').length+'/2',396,167,11,C.mint,'right');
 if(s.supply){for(let i=0;i<2;i++){const a=s.supply.options[i],x=17+i*202,selected=(s.x<210?0:1)===i;box(x,600,184,72,selected?'#345e4df5':'#213c38f5',6);if(selected){g.strokeStyle=C.gold;g.lineWidth=2;g.strokeRect(x+1,601,182,70);}const affordable=a.kind!=='pay'||s.power-a.v>=8;text(affordable?a.name+' '+s.power+a.op+' → '+supplyValue(s.power,a):a.name+' · 火力不足，取消',x+92,624,13,affordable?C.gold:C.red);text(a.detail.split(' · ')[1],x+92,644,10,C.pale);text((selected?'当前选择 · ':'移至此侧 · ')+Math.ceil(s.supply.remaining)+'s',x+92,661,10,selected?C.mint:C.red);}}
 else {text('同心 '+Math.floor(s.bond)+'% · 满值破盾',19,684,10,C.mint,'left');text('驻守占塔，塔会帮你清潮',19,731,10,'#b2c8a9','left');}

 if(s.transition>0){box(24,320,372,82,'#19392eed',12);text('防线前推',210,355,29,C.gold);text('塔已夺下，带着伙伴向下一座主堡推进',210,383,11,C.mint);}

function show(html){overlay.innerHTML=html;overlay.hidden=false;controls.hidden=true;}
function menu(){view='menu';show(`<div class="eyebrow">V0.8 · SIEGE / RECLAIM / ADVANCE</div><h1 class="title">火力突围<br><em>夺塔战线</em></h1><p class="subtitle">把敌人的堡垒，变成我们的路。</p><div class="rule"><b>墨墨集火攻城，咕咕破阵夺塔。</b><br>① 左右滑动，先拆一侧供能塔。<br>② 留在该侧 <b>1.4 秒</b>，清掉争夺者，夺塔支援。<br>③ 两侧塔都占领，主堡护盾失效，转中路突破。<br>④ 敌潮会反扑夺塔；<b>同心 45 起可用破阵</b>，满值能破盾。<br>夺下三座主堡，在援军封路前打通归途。</div><button class="primary" id="start">墨墨，跟紧我 →</button><p class="fine">手机原生触摸 · 手指滑出画布仍可控制<br>松手可重新按住 · 右下角独立破阵按钮<br>键盘 A/D 移动 · 空格破阵 · P 暂停<br>最高击破 ${best} · 无外部资源加载</p>`);document.querySelector('#start').onclick=()=>start();}
function start(seed){s=createGame(typeof seed==='number'?seed:Date.now());view='play';input.reset();keys={};overlay.hidden=true;controls.hidden=false;last=performance.now();}
function end(){view=s.mode;input.reset();best=Math.max(best,s.kills);try{localStorage.setItem('fr08best',best);}catch{}show(`<div class="eyebrow">${view==='win'?'THE ROAD IS OURS':'REGROUP · TRY ANOTHER BREACH'}</div><h1 class="title">${view==='win'?'这条路，我们夺回来了':'防线失守'}</h1><p class="subtitle">${view==='win'?'墨墨 ♥ 咕咕，一起回家。':'换个突破口，再冲一次。'}</p><div class="stats"><div>击破<strong>${s.kills}</strong></div><div>夺塔<strong>${s.captures}</strong></div><div>攻破主堡<strong>${Math.min(3,s.sector)}/3</strong></div></div><div class="rule">${s.reason}<br>${s.recaptures?'有 '+s.recaptures+' 次侧塔被反夺；反扑红圈出现时记得回援。':s.captures===0?'敌潮会不断补充。先拆侧塔，才能削弱兵源、打开主堡护盾。':'不要只清兵；侧塔断电后，转到中路集中攻城。'}<br>耗时 ${Math.floor(s.time)} 秒 · 补给 ${s.history.join(' / ')||'尚未领取'}</div><button class="primary" id="again">换条突破路线 ↻</button><button class="secondary" id="back">返回营地</button>`);document.querySelector('#again').onclick=()=>start();document.querySelector('#back').onclick=menu;}
function pause(){if(view==='pause'){resume();return;}if(view!=='play')return;view='pause';input.reset();keys={};show('<div class="eyebrow">HOLD THE LINE</div><h1 class="title">停一下，等你</h1><div class="rule">战场已暂停。<br>拆掉塔还不够，需要留在对应侧完成占领。侧塔被夺回时，主堡会重新获得供能。</div><button class="primary" id="resume">继续突破 →</button><button class="secondary" id="restart">重新开局</button>');document.querySelector('#resume').onclick=resume;document.querySelector('#restart').onclick=()=>start();}
function resume(){view='play';overlay.hidden=true;controls.hidden=false;last=performance.now();}
function beep(){if(muted)return;try{audio??=new(window.AudioContext||window.webkitAudioContext)();audio.resume();const o=audio.createOscillator(),a=audio.createGain();o.frequency.value=110;o.type='triangle';a.gain.setValueAtTime(.04,audio.currentTime);a.gain.exponentialRampToValueAtTime(.001,audio.currentTime+.18);o.connect(a).connect(audio.destination);o.start();o.stop(audio.currentTime+.2);}catch{}}
function useSkill(){if(pulse(s))beep();}
const input=bindInput({area:document.querySelector('#game'),canvas,skill,active:()=>view==='play',onMove:x=>s.target=clamp(x,30,390),onSkill:useSkill});
document.querySelector('#pause').onclick=pause;document.querySelector('#sound').onclick=()=>{muted=!muted;document.querySelector('#sound').textContent='音效 '+(muted?'OFF':'ON');beep();};
addEventListener('keydown',e=>{if(['ArrowLeft','ArrowRight',' '].includes(e.key))e.preventDefault();keys[e.key.toLowerCase()]=true;if(!e.repeat){if(e.key===' '&&view==='play')useSkill();if(e.key.toLowerCase()==='p')pause();}});addEventListener('keyup',e=>keys[e.key.toLowerCase()]=false);addEventListener('blur',()=>keys={});
document.addEventListener('visibilitychange',()=>{hidden=document.hidden;input.reset();keys={};last=performance.now();});
function frame(now){const dt=clamp((now-last)/1000,0,.04);last=now;if(view==='play'&&!freeze&&!hidden){const d=(keys.d||keys.arrowright?1:0)-(keys.a||keys.arrowleft?1:0);if(d)s.target=clamp(s.target+d*370*dt,30,390);step(s,dt);if(s.mode!=='play')end();}skill.disabled=s.bond<45||s.cooldown>0||s.transition>0;skill.querySelector('b').textContent=s.cooldown>0?'破阵冷却 '+s.cooldown.toFixed(1)+'s':s.bond>=100?'咕咕 · 满值破阵':s.bond>=45?'咕咕 · 破阵':'同心 '+Math.floor(s.bond)+' / 45';render();requestAnimationFrame(frame);}
menu();requestAnimationFrame(frame);
if(new URLSearchParams(location.search).has('test'))window.__game={state:()=>s,start,pause,resume,input,step:dt=>step(s,dt),pulse:useSkill,freeze:v=>freeze=v,render:()=>{render();if(s.mode!=='play'&&view==='play')end();}};

</script></body></html>
