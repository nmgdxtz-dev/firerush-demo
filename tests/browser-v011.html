<!doctype html><meta charset="utf-8"><title>V0.11 coastal road QA</title><style>body{margin:0;display:flex;background:#102c39;color:#d5eee3;font:13px system-ui;gap:15px}iframe{width:375px;height:667px;flex-shrink:0;border:0}aside{width:285px;padding:12px}button{padding:9px;margin:3px;border:0;border-radius:5px;background:#ffd3a0;color:#183c44}pre{font-size:11px;white-space:pre-wrap}</style><iframe id="app" src="../v011/?test"></iframe><aside><h2>V0.11 Tide QA</h2><p>沿海公路、真实障碍、擦边尾风、三段场景与触摸回归。</p><button id="run">触控与完整突破回归</button><button id="crowd">洪流压迫视图</button><button id="before">潮脊破口视图</button><button id="rush">向前冲锋中</button><button id="coast">港口路障</button><button id="canyon">赤岩栈道</button><button id="bridge">风暴桥</button><button id="step">参考路线逐帧前进</button><pre id="report">等待运行</pre></aside>
<script type="module">
import{control}from'../scripts/balance-v011.mjs';
const iframe=document.querySelector('iframe'),out=document.querySelector('#report'),api=()=>iframe.contentWindow.__game,wait=()=>new Promise(r=>requestAnimationFrame(r));let busy=false;if(new URLSearchParams(location.search).has('small')){iframe.style.width='320px';iframe.style.height='568px';}
const assert=(ok,name)=>{if(!ok)throw Error(name);return 'PASS '+name;};
function dispatch(target,type,touches,changed){const w=iframe.contentWindow;let e;try{const make=t=>new w.Touch({identifier:t.id,target:t.target||target,clientX:iframe.contentDocument.querySelector('canvas').getBoundingClientRect().left+t.x*iframe.contentDocument.querySelector('canvas').getBoundingClientRect().width/420,clientY:t.y||400});e=new w.TouchEvent(type,{bubbles:true,cancelable:true,touches:touches.map(make),changedTouches:changed.map(make)});}catch{e=new w.Event(type,{bubbles:true,cancelable:true});for(const[key,list]of Object.entries({touches,changedTouches:changed}))Object.defineProperty(e,key,{value:list.map(t=>({identifier:t.id,clientX:iframe.contentDocument.querySelector('canvas').getBoundingClientRect().left+t.x*iframe.contentDocument.querySelector('canvas').getBoundingClientRect().width/420,clientY:t.y||400}))});}target.dispatchEvent(e);}
async function replay(until){api().start(3);api().freeze(true);const s=api().state();for(let i=0;i<185*60&&s.mode==='play';i++){control(s);api().step(1/60);if(i%90===0){api().render();await wait();}if(until(s))break;}api().render();window.scrollTo(0,0);return s;}
async function run(){if(busy)return;busy=true;let log=[];try{const a=api(),w=iframe.contentWindow,doc=iframe.contentDocument,canvas=doc.querySelector('canvas'),skill=doc.querySelector('#skill');a.start(2);a.freeze(true);let s=a.state();
 dispatch(canvas,'touchstart',[{id:7,x:80}],[{id:7,x:80}]);dispatch(w,'touchmove',[{id:7,x:490}],[{id:7,x:490}]);log.push(assert(s.target===391&&a.input.trackedFinger()===7,'native touch continues beyond canvas'));
 dispatch(w,'touchend',[],[{id:7,x:490}]);dispatch(canvas,'touchstart',[{id:8,x:60}],[{id:8,x:60}]);log.push(assert(Math.abs(s.target-60)<.01&&a.input.trackedFinger()===8,'lift and re-press resume movement'));
 dispatch(w,'touchcancel',[],[]);dispatch(canvas,'touchstart',[{id:9,x:340}],[{id:9,x:340}]);log.push(assert(a.input.trackedFinger()===9,'empty cancel lists recover for next press'));a.render();await wait();await wait();
 dispatch(skill,'touchstart',[{id:9,x:340},{id:10,x:370,target:skill}],[{id:10,x:370,target:skill}]);dispatch(w,'touchend',[{id:9,x:340}],[{id:10,x:370,target:skill}]);dispatch(w,'touchmove',[{id:9,x:130}],[{id:9,x:130}]);log.push(assert(s.cooldown>0&&Math.abs(s.target-130)<.01&&a.input.trackedFinger()===9,'independent skill finger preserves movement'));dispatch(w,'touchend',[],[{id:9,x:130}]);
 a.freeze(false);a.pause();const at=s.time;await wait();await wait();log.push(assert(s.time===at&&doc.querySelector('#resume'),'manual pause stops time'));a.resume();a.freeze(true);log.push(assert(doc.querySelector('#overlay').hidden,'resume restores battlefield'));
 a.start(12);s=a.state();for(let i=0;i<185*60&&s.mode==='play';i++){control(s,'reckless');a.step(1/60);}a.render();log.push(assert(s.mode==='lose'&&s.hardRushes>=2&&doc.querySelector('#again'),'reckless rushing fails and renders retry'));doc.querySelector('#again').click();log.push(assert(a.state().distance===0&&a.state().hull===100,'retry resets world and touch state'));
 s=await replay(s=>s.dash&&s.dash.age>.23);log.push(assert(s.distance>s.camera+30&&s.dash,'rush moves world position and camera follows with visible lag'));
 s=await replay(()=>false);log.push(assert(s.mode==='win'&&s.distance>=5400,'complete unmodified simulation reaches escape'));log.push(assert(s.fronts.every(f=>f.breached),'all nine living ridges genuinely traversed'));log.push(assert(s.hardRushes===0&&s.peak>600,'clean seam strategy succeeds against real crowd'));log.push(assert(s.obstacleHits===0&&s.dodged===9,'all nine physical obstacles avoided'));log.push(assert(s.nearMisses>=4&&s.windRushes>0,'near-miss tailwind feeds forward rush'));log.push(assert(doc.querySelector('#practice'),'same-route practice available'));log.push(assert(+w.localStorage.getItem('fr011score')>0,'personal route record persisted locally'));const oldSeed=s.seed;doc.querySelector('#practice').click();log.push(assert(a.state().seed===oldSeed&&a.state().distance===0,'practice preserves route and resets progress'));log.push(assert(doc.querySelector('#again'),'victory UI offers another seam'));const choiceState=await replay(s=>!!s.choice);const widthBefore=choiceState.width;doc.querySelector('#formation button').click();log.push(assert(choiceState.width<widthBefore&&!choiceState.choice,'tap formation selects without leaving firing line'));
 log.push(JSON.stringify({seed:3,time:s.time,distance:s.distance,hull:s.hull,kills:s.kills,clean:s.cleanRushes,hard:s.hardRushes,peak:s.peak,rear:s.rear,dodged:s.dodged,nearMisses:s.nearMisses,windRushes:s.windRushes},null,2));
}catch(e){log.push('FAIL '+e.stack);}out.textContent=log.join('\n');busy=false;}
document.querySelector('#run').onclick=run;document.querySelector('#crowd').onclick=async()=>{if(busy)return;busy=true;const s=await replay(s=>s.time>1.2);out.textContent='洪流 '+s.enemies.length+' · 时间 '+s.time.toFixed(1);busy=false;};document.querySelector('#before').onclick=async()=>{if(busy)return;busy=true;const s=await replay(s=>s.fronts[0].open>2.8&&!s.fronts[0].breached&&!s.dash);out.textContent='潮脊已开 · 时间 '+s.time.toFixed(1);busy=false;};document.querySelector('#rush').onclick=async()=>{if(busy)return;busy=true;const s=await replay(s=>s.dash&&s.dash.age>.01&&s.fronts.some(f=>!f.breached&&f.z>s.dash.from&&f.z<s.dash.to));out.textContent='冲锋中 · 前进 '+s.distance.toFixed(1)+' · 镜头 '+s.camera.toFixed(1);busy=false;};
document.querySelector('#step').onclick=()=>{const a=api();for(let i=0;i<2;i++){control(a.state());a.step(1/60);}a.render();window.scrollTo(0,0);};
</script>
<script type="module">
import{control}from'../scripts/balance-v011.mjs';
for(const [id,z] of [['coast',500],['canyon',2000],['bridge',3900]])document.getElementById(id).onclick=async()=>{const a=document.querySelector('iframe').contentWindow.__game;a.start(3);a.freeze(true);const s=a.state();for(let i=0;i<120*60&&s.mode==='play'&&s.distance<z;i++){control(s);a.step(1/60);if(i%90===0){a.render();await new Promise(r=>requestAnimationFrame(r));}}a.render();window.scrollTo(0,0);document.querySelector('#report').textContent=id+' · '+s.distance.toFixed(1)+' · 绕行 '+s.dodged+' · 擦边 '+s.nearMisses;};
</script>
