<!doctype html><meta charset="utf-8"><style>body{margin:0;background:#152831;color:white;display:flex;gap:15px}iframe{border:0;width:375px;height:667px;flex-shrink:0}aside{width:300px}button{display:block;margin:12px;padding:12px}</style><iframe id="app" src="../preview/v0.14/?test"></iframe><aside><button id="touch">原生触摸回归</button><button id="shields">盾阵近景</button><button id="horse">骑射近景</button><button id="ride">汉骑突击</button><button id="run">完整战役回归</button><pre id="report">ready</pre></aside><script type="module">
import {control} from '../scripts/balance-v014.mjs';import{chooseFormation,spawnEnemy}from'../src/v014/game.js';const frame=document.querySelector('iframe'),report=document.querySelector('#report');if(location.search.includes('small')){frame.style.width='320px';frame.style.height='568px';}function api(){return frame.contentWindow.__game;}function init(){api().start(2);api().freeze(true);return api().state();}function scene(army,cavalry=false){const s=init();s.enemies=[];s.phase=army;s.distance=s.camera=army?9200:500;s.sector=army?3:0;for(let row=0;row<8;row++)for(let col=0;col<10;col++)spawnEnemy(s,75+col*29,s.distance+80+row*37,col%3===0?'heavy':'swarm');if(cavalry){s.choice={remaining:6};chooseFormation(s,1);api().step(.02);}api().render();report.textContent='scene '+army+' cavalry '+cavalry;window.scrollTo(0,0);}
document.querySelector('#shields').onclick=()=>scene(0);document.querySelector('#horse').onclick=()=>scene(1);document.querySelector('#ride').onclick=()=>scene(0,true);document.querySelector('#run').onclick=()=>{const s=init();let count=0;for(let i=0;i<601*60&&(s.mode==='play'||s.mode==='camp');i++){if(s.mode==='camp'){api().render();frame.contentDocument.querySelector('#repair').click();count++;}control(s);api().step(1/60);}api().render();report.textContent=JSON.stringify({mode:s.mode,kills:s.kills,remaining:s.enemies.length,cleared:s.cleared,camps:count,time:s.time,cache:api().stats()},null,2);window.scrollTo(0,0);};
</script>

<script type="module">const iframe=document.querySelector("iframe"),api=()=>iframe.contentWindow.__game,wait=()=>new Promise(r=>requestAnimationFrame(r));const assert=(ok,name)=>{if(!ok)throw Error(name);return "PASS "+name;};function dispatch(target,type,touches,changed){const w=iframe.contentWindow;let e;try{const make=t=>new w.Touch({identifier:t.id,target:t.target||target,clientX:iframe.contentDocument.querySelector('canvas').getBoundingClientRect().left+t.x*iframe.contentDocument.querySelector('canvas').getBoundingClientRect().width/420,clientY:t.y||400});e=new w.TouchEvent(type,{bubbles:true,cancelable:true,touches:touches.map(make),changedTouches:changed.map(make)});}catch{e=new w.Event(type,{bubbles:true,cancelable:true});for(const[key,list]of Object.entries({touches,changedTouches:changed}))Object.defineProperty(e,key,{value:list.map(t=>({identifier:t.id,clientX:iframe.contentDocument.querySelector('canvas').getBoundingClientRect().left+t.x*iframe.contentDocument.querySelector('canvas').getBoundingClientRect().width/420,clientY:t.y||400}))});}target.dispatchEvent(e);}
document.querySelector("#touch").onclick=async()=>{const log=[];try{const a=api(),w=iframe.contentWindow,doc=iframe.contentDocument,canvas=doc.querySelector('canvas'),skill=doc.querySelector('#skill');a.start(2);a.freeze(true);let s=a.state();
 dispatch(canvas,'touchstart',[{id:7,x:80}],[{id:7,x:80}]);dispatch(w,'touchmove',[{id:7,x:490}],[{id:7,x:490}]);log.push(assert(s.target===391&&a.input.trackedFinger()===7,'native touch continues beyond canvas'));
 dispatch(w,'touchend',[],[{id:7,x:490}]);dispatch(canvas,'touchstart',[{id:8,x:60}],[{id:8,x:60}]);log.push(assert(Math.abs(s.target-60)<.01&&a.input.trackedFinger()===8,'lift and re-press resume movement'));
 dispatch(w,'touchcancel',[],[]);dispatch(canvas,'touchstart',[{id:9,x:340}],[{id:9,x:340}]);log.push(assert(a.input.trackedFinger()===9,'empty cancel lists recover for next press'));a.render();await wait();await wait();
 dispatch(skill,'touchstart',[{id:9,x:340},{id:10,x:370,target:skill}],[{id:10,x:370,target:skill}]);dispatch(w,'touchend',[{id:9,x:340}],[{id:10,x:370,target:skill}]);dispatch(w,'touchmove',[{id:9,x:130}],[{id:9,x:130}]);log.push(assert(s.cooldown>0&&Math.abs(s.target-130)<.01&&a.input.trackedFinger()===9,'independent skill finger preserves movement'));dispatch(w,'touchend',[],[{id:9,x:130}]);
 a.freeze(false);a.pause();const at=s.time;await wait();await wait();log.push(assert(s.time===at&&doc.querySelector('#resume'),'manual pause stops time'));a.resume();a.freeze(true);log.push(assert(doc.querySelector('#overlay').hidden,'resume restores battlefield'));
}catch(e){log.push("FAIL "+e.message);}document.querySelector("#report").textContent=log.join("\n");};</script>
