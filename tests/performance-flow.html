<!doctype html><meta charset="utf-8"><title>Frame workload comparison</title><style>body{margin:0;display:flex;background:#122b35;color:#dff6ed;font:13px system-ui}iframe{width:375px;height:667px;border:0;flex-shrink:0}aside{padding:12px;width:340px}button{padding:12px;margin:5px}pre{white-space:pre-wrap}</style><iframe id="app" src="../v011/?test"></iframe><aside><button id="old">V0.11 开局测量</button><button id="new">V0.12 开局测量</button><pre id="report">等待</pre></aside><script type="module">
const frame=document.querySelector('iframe'),report=document.querySelector('#report');let working=false;
async function measure(version){if(working)return;working=true;report.textContent='测量 '+version;frame.src='../'+version+'/?test';await new Promise(r=>frame.onload=r);const w=frame.contentWindow,a=w.__game;const {control}=await import('../scripts/balance-'+version+'.mjs');a.start(3);a.freeze(false);let samples=[],intervals=[],previous=0,count=0;const native=w.requestAnimationFrame.bind(w);w.requestAnimationFrame=cb=>native(ts=>{const s=a.state();control(s);const begin=performance.now();cb(ts);const duration=performance.now()-begin;if(count++>5){samples.push(duration);if(previous)intervals.push(ts-previous);}previous=ts;if(samples.length===180){w.requestAnimationFrame=native;a.freeze(true);const p=(arr,q)=>[...arr].sort((a,b)=>a-b)[Math.floor(arr.length*q)];const state=a.state();const data={version,frames:samples.length,workP50:p(samples,.5),workP95:p(samples,.95),workMax:Math.max(...samples),intervalP50:p(intervals,.5),intervalP95:p(intervals,.95),over25ms:intervals.filter(n=>n>25).length,enemies:state.enemies.length,distance:state.distance,kills:state.kills};report.textContent=JSON.stringify(data,null,2);working=false;}});}
document.querySelector('#old').onclick=()=>measure('v011');document.querySelector('#new').onclick=()=>measure('v012');
</script>
