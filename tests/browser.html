<!doctype html><meta charset="utf-8"><title>V0.8 native touch & siege QA</title><style>body{margin:0;display:flex;background:#172c2a;color:#dbebcd;font:13px system-ui;gap:15px}iframe{width:420px;height:760px;flex-shrink:0;border:0}aside{width:285px;padding:12px}button{padding:9px;margin:3px;border:0;border-radius:5px;background:#efd09a;color:#254036}pre{font-size:11px;white-space:pre-wrap}</style><iframe id="app" src="../v08/?test"></iframe><aside><h2>V0.8 Siege QA</h2><p>原生 TouchEvent 合成事件回归 + 原引擎固定步长回放。</p><button id="run">检查触摸与完整通关</button><button id="crowd">密集敌潮视图</button><button id="capture">夺塔与侧翼反扑视图</button><pre id="report">等待运行</pre></aside>
<script type="module">
import{control}from'../scripts/balance.mjs';
const iframe=document.querySelector('iframe'),out=document.querySelector('#report'),api=()=>iframe.contentWindow.__game,wait=()=>new Promise(r=>requestAnimationFrame(r));
const assert=(ok,name)=>{if(!ok)throw Error(name);return 'PASS '+name;};
let busy=false;
function dispatch(target,type,touches,changed){const w=iframe.contentWindow;let e;try{const make=t=>new w.Touch({identifier:t.id,target:t.target||target,clientX:t.x,clientY:t.y||400});e=new w.TouchEvent(type,{bubbles:true,cancelable:true,touches:touches.map(make),changedTouches:changed.map(make)});}catch{e=new w.Event(type,{bubbles:true,cancelable:true});for(const [key,list]of Object.entries({touches,changedTouches:changed}))Object.defineProperty(e,key,{value:list.map(t=>({identifier:t.id,clientX:t.x,clientY:t.y||400}))});}target.dispatchEvent(e);}
async function replay(until){api().start(2);api().freeze(true);let s=api().state();for(let i=0;i<205*60&&s.mode==='play';i++){control(s,'right');api().step(1/60);if(i%120===0){api().render();await wait();}if(until(s))break;}api().render();return s;}
async function run(){if(busy)return;busy=true;let log=[];try{
 const a=api(),w=iframe.contentWindow,doc=iframe.contentDocument,canvas=doc.querySelector('canvas'),skill=doc.querySelector('#skill');a.start(2);a.freeze(true);let s=a.state();
 dispatch(canvas,'touchstart',[{id:7,x:80}],[{id:7,x:80}]);dispatch(w,'touchmove',[{id:7,x:490}],[{id:7,x:490}]);log.push(assert(s.target===390&&a.input.trackedFinger()===7,'finger outside canvas still steers via window'));
 dispatch(w,'touchend',[],[{id:7,x:490}]);dispatch(canvas,'touchstart',[{id:8,x:60}],[{id:8,x:60}]);log.push(assert(s.target===60&&a.input.trackedFinger()===8,'lift then re-press resumes with fresh identifier'));
 dispatch(w,'touchcancel',[],[{id:8,x:60}]);dispatch(canvas,'touchstart',[{id:9,x:340}],[{id:9,x:340}]);log.push(assert(a.input.trackedFinger()===9,'cancel then re-press resumes'));
 for(let i=0;i<5*60&&s.bond<45;i++)a.step(1/60);a.render();await wait();await wait();
 const before=s.target;dispatch(skill,'touchstart',[{id:9,x:340},{id:10,x:370,target:skill}],[{id:10,x:370,target:skill}]);dispatch(w,'touchend',[{id:9,x:340}],[{id:10,x:370,target:skill}]);dispatch(w,'touchmove',[{id:9,x:130}],[{id:9,x:130}]);log.push(assert(s.cooldown>0,'second finger triggers skill independently'));log.push(assert(s.target===130&&a.input.trackedFinger()===9,'skill finger release preserves movement finger'));
 dispatch(w,'touchend',[],[{id:9,x:130}]);
 a.freeze(false);a.pause();const at=s.time;await wait();await wait();log.push(assert(s.time===at&&doc.querySelector('#resume'),'manual pause stops simulation'));a.resume();a.freeze(true);log.push(assert(doc.querySelector('#overlay').hidden,'resume restores battlefield'));
 a.start(12);s=a.state();for(let i=0;i<30*60&&s.mode==='play';i++)a.step(1/60);a.render();log.push(assert(s.mode==='lose'&&doc.querySelector('#again'),'stationary play loses and shows retry'));doc.querySelector('#again').click();log.push(assert(a.state().base===100&&a.state().time===0,'retry resets operation and touch state'));
 s=await replay(()=>false);log.push(assert(s.mode==='win'&&s.sector===3,'real engine replay captures three fortress sectors'));log.push(assert(s.captures>=6&&s.recaptures>0,'replay exercises captures and enemy recapture'));log.push(assert(doc.querySelector('#again'),'victory screen offers another route'));
 log.push(JSON.stringify({seed:2,time:s.time,base:s.base,kills:s.kills,captures:s.captures,enemyRecaptures:s.recaptures,peak:s.peak},null,2));
}catch(e){log.push('FAIL '+e.stack);}out.textContent=log.join('\n');busy=false;}
document.querySelector('#run').onclick=run;document.querySelector('#crowd').onclick=async()=>{if(busy)return;busy=true;const s=await replay(s=>s.time>2);out.textContent='真实回放：敌潮 '+s.enemies.length+'，'+s.time.toFixed(1)+' 秒';busy=false;};document.querySelector('#capture').onclick=async()=>{if(busy)return;busy=true;const s=await replay(s=>s.captures>0&&s.raids.length>0);out.textContent='真实回放：夺塔 '+s.captures+'，'+s.time.toFixed(1)+' 秒';busy=false;};
</script>
