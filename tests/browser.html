<!doctype html><meta charset="utf-8"><title>Fire Rush · browser verification</title>
<style>body{margin:0;background:#080f19;color:#b5e9d9;font:13px system-ui;display:flex;gap:15px}aside{padding:15px;width:250px}button{padding:10px;margin:4px;background:#f8ca8e;border:0;border-radius:5px}iframe{border:0;height:760px;width:420px;flex-shrink:0}pre{white-space:pre-wrap;font-size:11px}</style>
<iframe id="game" src="../?test"></iframe><aside><h2>V0.7 Browser QA</h2><p>真实引擎固定步长回放；自动策略不修改生命 / 电荷 / 敌人。</p><button id="check">运行浏览器检查</button><button id="gate">回放至路线选择</button><button id="boss">回放至 Boss 核心暴露</button><pre id="report">等待运行</pre></aside>
<script type="module">
const frame=document.querySelector('iframe'),out=document.querySelector('pre');let failures=[];
const wait=()=>new Promise(r=>requestAnimationFrame(r));
const api=()=>frame.contentWindow.__game;
function assert(ok,label){if(!ok)throw new Error(label);return 'PASS '+label;}
function bot(s){let target=s.boss?s.boss.x:210;const urgent=s.enemies.filter(e=>!e.dead&&e.y>220).sort((a,b)=>b.y-a.y)[0];if(urgent)target=urgent.x;
 if(s.gate){const [a,b]=s.gate.options;let side=s.hull<65&&b.heal&&s.charge>=b.value?1:0;if(a.kind==='divide'&&s.hull>50)side=1;if(a.heal&&s.hull<70&&s.charge>=a.value)side=0;target=side===0?95:325;}
 let best=Infinity,bx=target;for(let x=30;x<=390;x+=15){let cost=Math.abs(x-target)*.12;for(const h of s.hazards)if(h.y>400&&h.y<595&&x>h.x-23&&x<h.x+h.w+23)cost+=250;for(const b of s.shots)if(b.y>430&&b.y<590)cost+=Math.max(0,38-Math.abs(b.x-x))*3;if(s.boss?.warning>0&&x>s.boss.lane*126+1&&x<s.boss.lane*126+167)cost+=200;if(cost<best){best=cost;bx=x;}}s.target=bx;
 if((s.enemies.filter(e=>e.y>270).length>9||s.shots.some(b=>Math.hypot(b.x-s.x,b.y-550)<65))&&s.charge>=18)api().pulse();}
async function replay(until){api().start(7);api().freeze(true);const s=api().state();for(let i=0;i<210*60&&s.mode==='play';i++){bot(s);api().step(1/60);if(i%120===0){api().render();await wait();}if(until(s))break;}api().render();return s;}
async function run(){let log=[];try{const a=api();a.start(7);a.freeze(false);let s=a.state();a.pause();const pausedAt=s.time;await wait();await wait();log.push(assert(s.time===pausedAt,'pause stops simulation time'));log.push(assert(frame.contentDocument.querySelector('#resume'),'pause overlay renders'));a.resume();a.freeze(true);log.push(assert(frame.contentDocument.querySelector('#overlay').hidden,'resume removes overlay'));
 const canvas=frame.contentDocument.querySelector('canvas'),r=canvas.getBoundingClientRect(),win=frame.contentWindow;
 canvas.dispatchEvent(new win.PointerEvent('pointerdown',{clientX:r.left+r.width*.2,clientY:r.top+r.height*.6,pointerId:1,bubbles:true}));
 canvas.dispatchEvent(new win.PointerEvent('pointermove',{clientX:r.left+r.width*.8,clientY:r.top+r.height*.6,pointerId:1,bubbles:true}));a.step(.02);log.push(assert(s.target>300,'pointer drag changes target'));canvas.dispatchEvent(new win.PointerEvent('pointercancel',{pointerId:1,bubbles:true}));const cancelled=s.target;canvas.dispatchEvent(new win.PointerEvent('pointermove',{clientX:r.left+r.width*.1,clientY:r.top+r.height*.6,pointerId:1,bubbles:true}));log.push(assert(s.target===cancelled,'pointer cancellation stops dragging'));
 a.start(12);s=a.state();for(let i=0;i<120*60&&s.mode==='play';i++)a.step(1/60);a.render();log.push(assert(s.mode==='lose'&&frame.contentDocument.querySelector('#again'),'idle defeat renders retry'));frame.contentDocument.querySelector('#again').click();log.push(assert(a.state().time===0&&a.state().hull===100,'retry resets run'));
 s=await replay(()=>false);log.push(assert(s.mode==='win','full run reaches victory without changing resources'));log.push(assert(s.history.length===6,'six route decisions resolved'));log.push(assert(frame.contentDocument.querySelector('#again'),'win overlay renders retry'));
 log.push(JSON.stringify({mode:s.mode,time:s.time,hull:s.hull,kills:s.kills,leaked:s.leaked,peak:s.peak},null,2));
}catch(e){log.push('FAIL '+e.stack);}out.textContent=log.join('\n');}
document.querySelector('#check').onclick=run;document.querySelector('#gate').onclick=async()=>{const s=await replay(s=>s.time>38);out.textContent='路线视图：真实回放至 '+s.time.toFixed(1)+'s';};document.querySelector('#boss').onclick=async()=>{const s=await replay(s=>s.boss?.exposed>2);out.textContent='Boss 视图：真实回放至 '+s.time.toFixed(1)+'s';};
</script>
