name: V0.10 tide verification
on: [push, pull_request]
jobs:
  tide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run balance:v010
      - run: npm run build:v010
      - run: git diff --exit-code -- preview/v0.10/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: firerush-v010-phone
          path: preview/v0.10/index.html
