name: V0.9 tide verification
on: [push, pull_request]
jobs:
  tide:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm run balance
      - run: npm run build
      - run: git diff --exit-code -- preview/v0.9/index.html
      - uses: actions/upload-artifact@v4
        with:
          name: firerush-v09-phone
          path: preview/v0.9/index.html
